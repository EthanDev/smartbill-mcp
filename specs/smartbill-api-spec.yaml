  responses:
    Unauthorized:
      description: Autentificare esuata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedResponse'
          examples:
            credentiale_invalide:
              summary: Credentiale invalide (user/parola gresite)
              value:
                key: "!.oresp@&"
                successfully: false
                errorText: Autentificare esuata. Va rugam verificati datele si incercati din nou.
                errorCode: "0"
                message: ''
                operationExecuted: false
                cooldown: 0
                needsConsent: false
            cif_firma_invalid:
              summary: CIF firma invalid
              value:
                key: "!.oresp@&"
                successfully: false
                errorText: Firma la care incercati sa va conectati nu mai este disponibila in Cloud.
                errorCode: "0"
                message: ''
                operationExecuted: false
                cooldown: 0
                needsConsent: false
    ServerError:
      description: Eroare interna de server. Poate aparea cand numele campurilor sunt trimise cu casing gresit (ex. `Price` in loc de `price`). Raspunsul este `text/html`, nu JSON - nu poate fi parsat programatic.
      content:
        text/html:
          schema:
            type: string
          example: |
            <!DOCTYPE html><html><head><title>Error report</title></head>
            <body><h1>HTTP Status 500 - Internal Server Error</h1></body></html>
    UnauthorizedV3:
      description: Autentificare esuata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponseV3'
          example:
            status: 401
            type: authentication_error
            instance: /SBORO/api/v3/companies/1234/clients
            errors:
              - code: invalid_api_key
                message: Invalid API key provided.
                docUrl: https://api.smartbill.ro/#v3-error-authentication_error
    ForbiddenV3:
      description: Permisiuni insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponseV3'
          example:
            status: 403
            type: authorization_error
            instance: /SBORO/api/v3/companies/1234/clients
            errors:
              - code: insufficient_permissions
                message: You do not have the permission to perform this action
                docUrl: https://api.smartbill.ro/#v3-error-authorization_error
    MethodNotAllowedV3:
      description: Metoda HTTP nepermisa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponseV3'
          example:
            status: 405
            type: invalid_request_error
            instance: /SBORO/api/v3/companies/1234/clients
            errors:
              - code: method_not_allowed
                message: The HTTP method is not allowed for the requested resource.
                docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
    NotAcceptableV3:
      description: Format neacceptat (Accept header invalid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemResponseV3'
          example:
            status: 406
            type: invalid_request_error
            instance: /SBORO/api/v3/companies/1234/clients
            errors:
              - code: invalid_accept_header
                message: The requested resource is not available in the requested format.
                docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
