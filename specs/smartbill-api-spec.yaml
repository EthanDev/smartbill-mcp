  /invoice/reverse:
    post:
      tags:
      - Facturi
      summary: Emitere factura storno
      operationId: createStornoInvoice
      security:
      - basicAuth: []
      description: |
        Storneaza o factura existenta. Trimite seria si numarul facturii originale; `issueDate` este optional.

        **Ai primit o eroare la emiterea facturii storno?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `companyVatCode`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice stornarii.

        <details>
        <summary><strong>Erori la emiterea facturii storno</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>number</code> lipseste</td>
              <td><code>Numarul facturii trebuie specificat in parametrul 'number'!</code></td>
              <td>Trimite `number` cu numarul facturii de stornat, exact ca in cont, de exemplu `3738`.</td>
            </tr>
            <tr>
              <td><code>seriesName</code> lipseste</td>
              <td><code>Seria facturii trebuie specificata in parametrul 'seriesname'!</code></td>
              <td>Trimite `seriesName` cu seria facturii de stornat, de exemplu `fac`.</td>
            </tr>
            <tr>
              <td>Factura de stornat nu exista</td>
              <td><code>Factura cu seria si numarul fac99999999 nu a fost gasita!</code></td>
              <td>Verifica `seriesName` si `number`. Combinatia serie plus numar trebuie sa existe in cont.</td>
            </tr>
            <tr>
              <td>Factura a fost deja stornata</td>
              <td><code>Factura este deja stornata.</code></td>
              <td>O factura poate fi stornata o singura data. Verifica daca exista deja o factura storno pentru acest document.</td>
            </tr>
            <tr>
              <td>Factura de stornat este anulata</td>
              <td><code>Factura fac3830 este anulata.</code></td>
              <td>Nu poti storna o factura anulata. Restaureaz-o intai (daca chiar vrei sa o stornezi) sau storneaza o factura activa.</td>
            </tr>
            <tr>
              <td>Incerci sa stornezi o factura care e ea insasi storno</td>
              <td><code>Factura fac3739 este de tip storno. Nu se poate storna.</code></td>
              <td>Nu se poate storna un document de tip storno. Trimite in `number` factura originala, nu factura storno.</td>
            </tr>
            <tr>
              <td><code>issueDate</code> anterioara datei facturii originale</td>
              <td><code>Data emiterii facturii storno nu poate fi anterioara datei emiterii facturii stornate.</code></td>
              <td>Trimite `issueDate` egala sau ulterioara datei facturii stornate.</td>
            </tr>
            <tr>
              <td><code>issueDate</code> in format gresit</td>
              <td><code>Could not map property: issueDate.</code></td>
              <td>Trimite `issueDate` in format `yyyy-MM-dd`, de exemplu `2026-07-15`.</td>
            </tr>
          </tbody>
        </table>

        </details>

        - --

        ## Tipuri de stornare

        <details>
        <summary><strong>1. Storno simplu</strong></summary>

        Stornarea unei facturi existente. Storno-ul preia automat seria facturii originale si primeste data curenta.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_FACTURII",
          "number": "3738"
        }
        ```

        </details>

        <details>
        <summary><strong>2. Storno cu data specifica</strong></summary>

        Seteaza `issueDate` cand vrei ca factura storno sa aiba o data diferita de cea curenta. Data nu poate fi anterioara datei facturii originale.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_FACTURII",
          "number": "3738",
          "issueDate": "2026-07-15"
        }
        ```

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - companyVatCode
              - seriesName
              - number
              properties:
                companyVatCode:
                  type: string
                  description: CIF-ul firmei tale.
                seriesName:
                  type: string
                  description: Seria facturii originale.
                number:
                  type: string
                  description: Numarul facturii originale.
                issueDate:
                  type: string
                  format: date
                  description: Data facturii storno. Daca lipseste, se foloseste data curenta.
            examples:
              storno_simplu:
                summary: "1. Storno simplu"
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_FACTURII
                  number: '3738'
              storno_cu_data:
                summary: "2. Storno cu data specifica"
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_FACTURII
                  number: '3738'
                  issueDate: '2026-07-15'
      responses:
        '200':
          description: Factura storno creata cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
              example:
                errorText: ''
                message: ''
                number: '3739'
                series: SERIA_FACTURII
                url: ''
                documentId: 302368801
                documentUrl: https://cloud.smartbill.ro/documente/editare/factura/302368801/
                documentViewUrl: https://cloud.smartbill.ro/documente/extern/pf/factura/...
        '400':
          description: Operatiune invalida - factura negasita sau storno imposibil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numar_lipsa:
                  summary: Parametrul number lipsa
                  value:
                    errorText: "Numarul facturii trebuie specificat in parametrul 'number'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                serie_lipsa:
                  summary: Parametrul seriesName lipsa
                  value:
                    errorText: "Seria facturii trebuie specificata in parametrul 'seriesname'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                factura_negasita:
                  summary: Factura de stornat nu exista
                  value:
                    errorText: Factura cu seria si numarul fac99999999 nu a fost gasita!
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                data_anterioara:
                  summary: Data storno anterioara facturii originale
                  value:
                    errorText: Data emiterii facturii storno nu poate fi anterioara datei emiterii facturii stornate.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                deja_stornata:
                  summary: Factura a fost deja stornata
                  value:
                    errorText: Factura este deja stornata.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                factura_de_tip_storno:
                  summary: Nu se poate storna o factura storno
                  value:
                    errorText: Factura fac3739 este de tip storno. Nu se poate storna.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                format_data_invalid:
                  summary: issueDate in format gresit (eroare de mapare JSON)
                  value:
                    status: 400
                    type: invalid_request_error
                    instance: /SBORO/api/invoice/reverse
                    errors:
                    - code: json_mapping_error
                      message: 'Could not map property: issueDate.'
                      docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
                      param: issueDate
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /invoice/pdf:
    get:
      tags:
      - Facturi
      summary: Descarcare factura PDF
      operationId: getInvoicePdf
      security:
      - basicAuth: []
      description: |
        Descarca factura in format PDF. Parametrii se trimit in URL (query string).

        Factura poate fi preluata prin API doar ca fisier PDF. Nu exista endpoint pentru factura in format JSON sau XML.

        Raspunsul de succes este un fisier binar (`application/octet-stream`), trimis cu `Content-Disposition: attachment` si cu numele fisierului format din `factura` + serie + numar - de exemplu `facturafac3880.pdf`.

        `Content-Type` din raspuns oglindeste header-ul `Accept` trimis in cerere: daca ceri `Accept: application/json`, raspunsul e etichetat `application/json`, desi corpul ramane acelasi PDF. Nu te baza pe `Content-Type` ca sa decizi cum tratezi raspunsul.

        **Nu trimite `Accept: application/pdf`.** Valoarea cea mai naturala e singura care nu merge: raspunsul e `406` cu `{"code": "invalid_accept_header"}`, nu PDF-ul. Merg `application/octet-stream`, `*/*`, `application/json` sau lipsa completa a header-ului `Accept`.

        Atentie la erori: acest endpoint **nu** intoarce o eroare de API. Orice parametru lipsa sau document inexistent duce la `502 Bad Gateway`, cu corp HTML, care nu se poate interpreta programatic. Spre deosebire de el, [proforma in PDF](#tag/proforme/GET/estimate/pdf) intoarce `400` cu `errorText` in JSON.
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      - name: seriesname
        in: query
        required: true
        description: Seria facturii
        schema:
          type: string
        example: SERIA_FACTURII
      - name: number
        in: query
        required: true
        description: Numarul facturii
        schema:
          type: string
        example: '3769'
      responses:
        '200':
          description: |
            Fisierul PDF al facturii, ca flux binar (`application/octet-stream`). Salveaza-l intr-un fisier `.pdf`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '502':
          description: |
            Parametri lipsa sau factura inexistenta. Verifica `seriesname`, `number` si existenta facturii.
          content:
            text/html:
              schema:
                type: string
              example: |
                <html>
                <head><title>502 Bad Gateway</title></head>
                <body>
                <center><h1>502 Bad Gateway</h1></center>
                <hr><center>nginx</center>
                </body>
                </html>
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invoice/paymentstatus:
    get:
      tags:
      - Facturi
      summary: Verificare incasare factura
      operationId: getInvoicePaymentStatus
      security:
      - basicAuth: []
      description: |
        Verifica daca o factura este incasata si ce suma mai ramane de incasat. Parametrii se trimit in URL (query string).

        **Ce intorc campurile:**

        - `invoiceTotalAmount` - valoarea totala a facturii (cu TVA).
        - `paidAmount` - suma incasata pana acum.
        - `unpaidAmount` - suma ramasa de incasat (`invoiceTotalAmount - paidAmount`).
        - `paid` - `true` daca factura e incasata integral, altfel `false`.

        **Ai primit o eroare la verificarea incasarii?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice acestui endpoint.

        <details>
        <summary><strong>Erori la verificarea incasarii</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>number</code> lipseste din URL</td>
              <td><code>Numarul facturii trebuie specificat</code></td>
              <td>Adauga `number` in query string cu numarul facturii, de exemplu `number=3762`.</td>
            </tr>
            <tr>
              <td>Serie lipsa, serie gresita sau factura inexistenta</td>
              <td><code>Factura nu a fost gasita</code></td>
              <td>Verifica `seriesname` si `number`. Daca lipseste seria sau combinatia serie plus numar nu exista, API-ul raspunde cu acelasi mesaj.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      - name: seriesname
        in: query
        required: true
        description: Seria facturii
        schema:
          type: string
        example: SERIA_FACTURII
      - name: number
        in: query
        required: true
        description: Numarul facturii
        schema:
          type: string
        example: '3762'
      responses:
        '200':
          description: Statusul platii facturii
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorText:
                    type: string
                  invoiceTotalAmount:
                    type: number
                    description: Valoarea totala a facturii (cu TVA)
                  paidAmount:
                    type: number
                    description: Suma incasata pana acum
                  unpaidAmount:
                    type: number
                    description: Suma ramasa de incasat
                  paid:
                    type: boolean
                    description: true daca factura e incasata integral
              example:
                errorText: ''
                message: ''
                number: ''
                series: ''
                url: ''
                invoiceTotalAmount: 121.0
                paidAmount: 0
                unpaidAmount: 121.0
                paid: false
        '400':
          description: Parametru lipsa in URL sau document negasit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numar_lipsa:
                  summary: Parametrul number lipsa
                  value:
                    errorText: Numarul facturii trebuie specificat
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    paid: false
                factura_negasita:
                  summary: Serie lipsa sau factura inexistenta
                  value:
                    errorText: Factura nu a fost gasita
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    paid: false
        '401':
          $ref: '#/components/responses/Unauthorized'
