        aviz:
          type: string
          description: 'Numarul avizului de insotire a marfii. Apare pe proforma, in footer, sub forma `Nr aviz: <valoare>`.'
          x-description-en: 'Number of the delivery note. It appears on the estimate, in the footer, as `Nr aviz: <value>`.'
          example: AV-1908
    PaymentRequest:
      type: object
      required:
      - companyVatCode
      - type
      properties:
        companyVatCode:
          type: string
          description: CIF-ul firmei tale, exact ca in SmartBill Cloud.
        type:
