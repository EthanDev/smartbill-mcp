          x-description-en: Tax name
          example: Normala
        taxPercentage:
          type: number
          description: Cota TVA a liniei. SmartBill accepta cotele existente in cont, inclusiv cote personalizate.
          x-description-en: VAT percentage rate. SmartBill accepts the VAT rates available in the account, including custom rates.
          example: 21
        warehouseName:
          type: string
          description: Numele gestiunii pentru descarcare stoc (case-sensitive!)
          x-description-en: Warehouse name for stock discharge (case-sensitive!)
        isDiscount:
          type: boolean
          description: Este linie de discount
          x-description-en: Is this a discount line
          default: false
        numberOfItems:
          type: integer
          description: 'Numarul de linii **imediat anterioare** la care se aplica discountul. **Obligatoriu pe o linie de discount**: fara el discountul e ignorat in silentiu, apelul intoarce `200`, iar documentul se emite cu totalul neredus.'
          x-description-en: 'Number of **immediately preceding** lines the discount applies to. **Required on a discount line**: without it the discount is silently ignored, the call returns `200`, and the document is issued with the total unreduced.'
        discountType:
          type: integer
          description: |
            Tipul discountului. `1` = valoric, cu valoarea in `discountValue`. `2` = procentual, cu procentul in `discountPercentage`. Implicit `2`: o linie de discount fara `discountType`, dar cu ambele valori trimise, aplica procentul.

            **Trimite doar `1` sau `2`.** O alta valoare nu e respinsa, dar produce un document gresit: discountul valoric se scade din total fara sa ajusteze TVA-ul, iar un discount procentual e ignorat complet. Pentru un produs de 100 lei cu TVA 21% si un discount de 10 lei, `discountType: 1` da 108.9, iar o valoare in afara enumerarii da 111.
          x-description-en: |
            Discount type. `1` = value discount, with the amount in `discountValue`. `2` = percentage discount, with the percentage in `discountPercentage`. Defaults to `2`: a discount line without `discountType`, but with both values sent, applies the percentage.

            **Send only `1` or `2`.** Any other value is not rejected, but it produces an incorrect document: a value discount is subtracted from the total without adjusting VAT, and a percentage discount is ignored entirely. For a 100 RON product with 21% VAT and a 10 RON discount, `discountType: 1` gives 108.9, while a value outside the enumeration gives 111.
          default: 2
          enum:
          - 1
          - 2
        discountValue:
          type: number
          exclusiveMaximum: 0
          description: 'Valoarea discountului, pentru discount valoric, cand `discountType` este `1`. **Trebuie sa fie negativa**, deci se trimite cu semnul minus: `-10` pentru un discount de 10 lei. O valoare pozitiva nu e respinsa, dar **creste** totalul in loc sa il scada - un produs de 100 lei cu `discountValue: 10` da 133.1, nu 108.9.'
          x-description-en: 'Discount value, for value discounts, when `discountType` is `1`. **It must be negative**, so send it with a minus sign: `-10` for a 10 RON discount. A positive value is not rejected, but it **increases** the total instead of reducing it - a 100 RON product with `discountValue: 10` gives 133.1, not 108.9.'
        discountPercentage:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          description: Procentul discountului. Se foloseste pentru discount procentual, cand `discountType` este `2`. Valoarea trebuie sa fie mai mare decat 0 si cel mult 100.
          x-description-en: Discount percentage. Used for percentage discounts, when `discountType` is `2`. The value must be greater than 0 and at most 100.
        translatedName:
          type: string
          description: Numele produsului in limba documentului
          x-description-en: Product name in document language
        translatedMeasuringUnit:
          type: string
          description: Unitatea de masura in limba documentului
          x-description-en: Unit name in document language
        saveToDb:
          type: boolean
          description: 'Salveaza produsul in nomenclator daca e nou. Cand produsul exista deja si e trimis cu `saveToDb: true`, datele lui din nomenclator se actualizeaza din cerere - inclusiv numele. La descarcare de gestiune (`useStock: true`) actualizarea se face oricum, chiar si cu `saveToDb: false`.'
          x-description-en: 'Saves the product to the catalogue if it is new. When the product already exists and is sent with `saveToDb: true`, its catalogue record is updated from the request - including the name. With stock discharge (`useStock: true`) the update happens regardless, even with `saveToDb: false`.'
          default: false
        useSBProductName:
          type: boolean
          description: |
            Controleaza ce nume apare pe factura cand produsul este identificat prin `code`, iar denumirea trimisa in `name` difera de cea din nomenclator. `true` = pe factura se foloseste numele produsului din SmartBill, iar numele din nomenclator NU se modifica. `false` sau absent = pe factura se foloseste numele trimis prin `name`, iar acesta suprascrie numele produsului in nomenclator (inclusiv cand `saveToDb` este `false`). Necesita setarea "Foloseste cod produs" activata pe firma.
          x-description-en: |
            Controls which name appears on the invoice when the product is matched by `code` and the name sent in `name` differs from the one in the nomenclature. `true` = the invoice uses the product name from SmartBill and the nomenclature name is NOT changed. `false` or omitted = the invoice uses the name sent in `name`, which overwrites the product name in the nomenclature (even when `saveToDb` is `false`). Requires the "Foloseste cod produs" setting enabled for the company.
          default: false
