    ### Erori API V3

    API-ul V3 returneaza erorile in format JSON, folosind o structura unitara. Campul `errors` poate contine una sau mai multe erori intr-un singur raspuns.

    **Format standard**

    ```http
    HTTP/1.1 400 Bad Request
    Content-Type: application/json
    ```

    ```json
    {
      "status": 400,
      "type": "validation_error",
      "instance": "/api/v3/clients",
      "errors": [
        {
          "code": "missing_required_field",
          "message": "must not be blank",
          "docUrl": "https://api.smartbill.ro/#v3-error-validation_error",
          "param": "name"
        }
      ]
    }
    ```

    | Camp | Tip | Descriere |
    |---|---|---|
    | `status` | integer | Codul HTTP al raspunsului. |
    | `type` | string | Categoria generala a erorii. |
    | `instance` | string | URI-ul cererii care a produs eroarea. |
    | `errors` | array | Lista erorilor identificate. Contine unul sau mai multe elemente. |
    | `errors[].code` | string | Codul stabil folosit pentru tratarea programatica a erorii. |
    | `errors[].message` | string | Mesaj explicativ destinat diagnosticarii sau afisarii. |
    | `errors[].docUrl` | string | URL-ul documentatiei pentru eroarea respectiva. |
    | `errors[].param` | string, optional | Campul sau parametrul care a produs eroarea. |

    Aplicatia client trebuie sa foloseasca `type` si `errors[].code` pentru luarea deciziilor. Textul din `message` nu trebuie folosit ca identificator stabil.

    `docUrl` duce mereu la categoria de eroare, nu la codul individual. Forma este `https://api.smartbill.ro/#v3-error-{type}`, de exemplu `https://api.smartbill.ro/#v3-error-authentication_error`. Nu exista un URL per `code`: toate erorile cu acelasi `type` primesc acelasi `docUrl`. Pentru a distinge cazul concret, foloseste `errors[].code`.

    **Tipurile de eroare**

    | `type` | Semnificatie | Coduri HTTP | Link intern |
    |---|---|---|---|
    | `authentication_error` | Cheia API nu poate fi autentificata. | `401` | [vezi tabelul](#v3-error-authentication_error) |
    | `authorization_error` | Cheia API este autentificata, dar operatia nu este permisa. | `403` | [vezi tabelul](#v3-error-authorization_error) |
    | `invalid_request_error` | Cererea, resursa sau reprezentarea HTTP este incorecta. | `400`, `404`, `405`, `406`, `415`, `429` | [vezi tabelul](#v3-error-invalid_request_error) |
    | `validation_error` | Datele din cerere nu respecta regulile de validare. | `400` | [vezi tabelul](#v3-error-validation_error) |
    | `api_error` | API-ul nu poate procesa cererea dintr-o cauza interna sau temporara. | `500`, `503` | [vezi tabelul](#v3-error-api_error) |

    <span id="v3-error-authentication_error"></span>

    **authentication_error - Erori de autentificare**

    Toate erorile din aceasta categorie au `type: authentication_error` si returneaza `401 Unauthorized`.

    | `code` | Descriere | Actiunea recomandata |
    |---|---|---|
    | `missing_authorization` | Header-ul `Authorization` lipseste sau are o valoare goala. | Trimite header-ul `Authorization` folosind schema Bearer. |
    | `invalid_authorization_format` | Header-ul `Authorization` nu respecta formatul acceptat. | Verifica schema Bearer, prezenta tokenului si absenta valorilor suplimentare. |
    | `invalid_api_key` | Cheia API nu poate fi validata. | Verifica cheia si inlocuieste-o daca nu mai este valida. Nu retrimite automat cererea cu aceeasi cheie. |
    | `wrong_environment` | Cheia API apartine unui alt mediu decat cel al rutei apelate. | Foloseste cheia API si URL-ul corespunzatoare aceluiasi mediu. |

    Formatul corect al header-ului de autentificare este:

    ```http
    Authorization: Bearer <token>
    ```

    Pe V3, un token `sb_test_` folosit pe productie sau un token de productie folosit pe test returneaza `401`, chiar daca tokenul este valid pentru mediul lui.

    <span id="v3-error-authorization_error"></span>

    **authorization_error - Erori de autorizare**

    Toate erorile din aceasta categorie au `type: authorization_error` si returneaza `403 Forbidden`.

    | `code` | Descriere | Actiunea recomandata |
    |---|---|---|
    | `insufficient_permissions` | Utilizatorul asociat cheii API nu are permisiunea necesara. | Foloseste un utilizator autorizat sau acorda permisiunea necesara. |
    | `subscription_expired` | Abonamentul companiei a expirat. | Reinnoieste abonamentul inainte de a retrimite cererea. |
    | `subscription_limit_exceeded` | A fost depasita limita inclusa in abonamentul companiei. | Redu utilizarea sau modifica abonamentul. |
    | `subscription_not_found` | Compania nu are un abonament asociat. | Activeaza un abonament inainte de a retrimite cererea. |
    | `subscription_not_valid` | Abonamentul curent nu permite operatia API solicitata. | Foloseste un abonament compatibil cu operatia. |

    Erorile de autorizare nu trebuie retrimise automat. Aceeasi cerere va continua sa primeasca `403 Forbidden` pana la modificarea permisiunilor sau a abonamentului.

    <span id="v3-error-invalid_request_error"></span>

    **invalid_request_error - Erori ale cererii**

    Erorile din aceasta categorie au `type: invalid_request_error` si indica o problema cu ruta, metoda, headerele, parametrii, corpul JSON sau limita de trafic.

    | `code` | Cod HTTP | Descriere | Actiunea recomandata |
    |---|---:|---|---|
    | `company_not_found` | `404` | Compania identificata prin codul fiscal nu a fost gasita. | Verifica codul fiscal si accesul cheii API la companie. |
    | `supplier_not_found` | `404` | Furnizorul identificat prin ID nu a fost gasit. | Verifica ID-ul sau actualizeaza lista furnizorilor. |
    | `client_not_found` | `404` | Clientul identificat prin ID nu a fost gasit. | Verifica ID-ul sau actualizeaza lista clientilor. |
    | `product_not_found` | `404` | Produsul identificat prin ID nu a fost gasit. | Verifica ID-ul sau actualizeaza lista produselor. |
    | `warehouse_not_found` | `404` | Gestiunea identificata prin ID nu a fost gasita. | Verifica ID-ul sau actualizeaza lista gestiunilor. |
    | `resource_not_found` | `404` | Ruta sau resursa solicitata nu exista. | Verifica versiunea API, URL-ul, calea si ID-ul resursei. |
    | `method_not_allowed` | `405` | Metoda HTTP nu este permisa pentru ruta solicitata. | Foloseste metoda indicata in documentatia rutei. |
    | `invalid_accept_header` | `406` | Header-ul `Accept` nu solicita formatul returnat de API. | Foloseste `Accept: application/json`. |
    | `invalid_content_type` | `415` | Header-ul `Content-Type` nu declara formatul acceptat de API. | Pentru cererile care au corp, foloseste `Content-Type: application/json`. |
    | `bad_request` | `400` | Cererea contine parametri invalizi sau date lipsa. | Verifica parametrii, headerele si corpul cererii. |
    | `json_parse_error` | `400` | Corpul cererii nu este un document JSON valid. | Verifica ghilimelele, virgulele, parantezele, caracterele escape si inchiderea sirurilor. |
    | `json_mapping_error` | `400` | JSON-ul este valid sintactic, dar structura sau valorile nu corespund modelului acceptat. | Corecteaza numele, tipul sau structura campului indicat prin `param`. |
    | `missing_vat_code` | `400` | Codul fiscal necesar operatiei lipseste sau are o valoare goala. | Furnizeaza un cod fiscal valid. |
    | `malformed_id` | `400` | ID-ul resursei lipseste sau nu respecta formatul solicitat. | Foloseste ID-urile returnate de API fara a le modifica structura. |
    | `rate_limit_exceeded` | `429` | Aplicatia client a depasit limita de cereri permisa. | Respecta `Retry-After`, foloseste temporizare exponentiala si adauga o variatie aleatorie intre reincercari. |

    API-ul accepta si returneaza exclusiv `application/json`. Pentru cererile care au corp, foloseste:

    ```http
    Accept: application/json
    Content-Type: application/json
    ```

    Pentru `json_mapping_error`, campul `param` poate contine calea completa a proprietatii afectate:

    ```json
    {
      "code": "json_mapping_error",
      "message": "Could not parse property: payment.isCash.",
      "docUrl": "https://api.smartbill.ro/#v3-error-invalid_request_error",
      "param": "payment.isCash"
    }
    ```

    <span id="v3-error-validation_error"></span>

    **validation_error - Erori de validare**

    Toate erorile din aceasta categorie au `type: validation_error` si returneaza `400 Bad Request`.

    | `code` | Descriere | Actiunea recomandata |
    |---|---|---|
    | `invalid_field_type` | Valoarea unui camp sau parametru nu are tipul solicitat. | Trimite valoarea folosind tipul corect. |
    | `invalid_field_value` | Valoarea are tipul corect, dar nu respecta regulile acceptate. | Corecteaza valoarea indicata prin `param`. |
    | `invalid_enum_value` | Valoarea nu apartine listei de optiuni acceptate. | Foloseste una dintre valorile documentate pentru camp. |
    | `missing_required_field` | Un camp obligatoriu lipseste, este gol sau are valoarea `null`. | Furnizeaza campul indicat prin `param`. |
    | `invalid_field_format` | Valoarea nu respecta formatul solicitat. | Corecteaza formatul campului, de exemplu formatul unei date sau adrese de e-mail. |
    | `dependency_not_available` | Valoarea solicitata depinde de o optiune indisponibila in contextul cererii. | Verifica datele asociate si conditiile documentate pentru ruta. |

    Un raspuns poate contine mai multe erori, cate una pentru fiecare camp invalid:

    ```json
    {
      "status": 400,
      "type": "validation_error",
      "instance": "/api/v3/resource",
      "errors": [
        {
          "code": "missing_required_field",
          "message": "must not be blank",
          "docUrl": "https://api.smartbill.ro/#v3-error-validation_error",
          "param": "name"
        },
        {
          "code": "invalid_field_format",
          "message": "must be a well-formed email address",
          "docUrl": "https://api.smartbill.ro/#v3-error-validation_error",
          "param": "email"
        }
      ]
    }
    ```

    Aplicatia client trebuie sa proceseze intreaga lista `errors`, nu doar primul element.

    <span id="v3-error-api_error"></span>

    **api_error - Erori ale API-ului**

    Erorile din aceasta categorie au `type: api_error` si indica o cauza interna sau temporara.

    | `code` | Cod HTTP | Descriere | Actiunea recomandata |
    |---|---:|---|---|
    | `maintenance_in_progress` | `503` | API-ul este temporar indisponibil din cauza unei perioade de mentenanta. | Respecta `Retry-After` si amana cererile. |
    | `rate_limit_temporarily_unavailable` | `503` | Serviciul de evaluare a limitei de trafic este temporar indisponibil. | Respecta `Retry-After` si foloseste temporizare exponentiala. |
    | `query_timeout` | `503` | Operatia a depasit timpul maxim de executie. | Retrimite cererea dupa o secunda sau ajusteaza parametrii cererii. |
    | `internal_error` | `500` | API-ul a intampinat o eroare neasteptata. | Reincearca controlat numai daca operatia este idempotenta sau protejata impotriva duplicarii. |

    `rate_limit_temporarily_unavailable` indica faptul ca limita de trafic nu a putut fi evaluata temporar. Nu indica depasirea limitei de catre aplicatia client.

    Daca un `internal_error` persista, pastreaza valorile `instance` si `code` pentru comunicarea cu echipa de suport.

    **Tratarea erorilor in aplicatia client**

    | Cod HTTP | Reincercare recomandata | Actiune |
    |---:|---|---|
    | `400` | Nu | Corecteaza parametrii sau corpul cererii. |
    | `401` | Nu, cu aceeasi cheie API | Corecteaza sau inlocuieste cheia API. |
    | `403` | Nu | Corecteaza permisiunile sau abonamentul. |
    | `404` | Nu | Verifica ruta sau ID-ul resursei. |
    | `405` | Nu | Foloseste metoda HTTP corecta. |
    | `406` | Nu | Corecteaza header-ul `Accept`. |
    | `415` | Nu | Corecteaza header-ul `Content-Type`. |
    | `429` | Da | Respecta `Retry-After` si aplica temporizare exponentiala. |
    | `500` | Limitat | Reincearca numai operatiile idempotente sau protejate impotriva duplicarii. |
    | `503` | Da | Respecta `Retry-After` si aplica temporizare exponentiala. |

    In loguri, pastreaza codul HTTP, `type`, fiecare valoare `errors[].code`, `errors[].param` daca este prezent si `instance`. Nu scrie in log chei API, header-ul `Authorization`, tokenuri de acces sau date sensibile din cerere ori raspuns.

    ## Rate Limiting

    ### API V1

    In **API V1**, accesul este limitat la **30 de apeluri in 10 secunde** per token. In caz de abatere, accesul este blocat timp de **10 minute**.

    Raspunsurile serverului SmartBill includ headere care indica starea ferestrei curente de 10 secunde:

    | Header | Descriere |
    |--------|-----------|
    | `X-RateLimit-Limit` | Cate apeluri se pot face in fereastra de 10 secunde. Pentru V1 valoarea este `30`. |
    | `X-RateLimit-Remaining` | Numarul de apeluri ramase in fereastra curenta de 10 secunde. |
    | `X-RateLimit-Reset` | Unix timestamp cand incepe noua fereastra de 10 secunde. |

    ### API V3

    In **API V3**, rate limit-urile se aplica cererilor autentificate catre endpoint-urile publice si sunt calculate pentru utilizatorul si compania asociate cererii. Daca acelasi utilizator si aceeasi companie folosesc mai multe token-uri, servicii sau aplicatii, cererile se cumuleaza in aceleasi limite.

    Daca nu ai primit alte limite prin contract sau printr-o comunicare SmartBill, se aplica urmatoarele valori standard:

    | Categorie | Limita standard |
    |-----------|-----------------|
    | Citire (`GET`, `HEAD`) | 60 cereri la 10 secunde |
    | Scriere (`POST`, `PUT`, `PATCH`, `DELETE` si alte metode non-`GET`/non-`HEAD`) | 30 cereri la 10 secunde |
    | Total zilnic | 50.000 cereri pe zi |

    Limita zilnica se reseteaza, in mod standard, la miezul noptii conform fusului orar al Romaniei (`Europe/Bucharest`). Limitele pot fi diferite pentru anumite conturi sau companii, deci clientii API trebuie sa citeasca valorile efective din header-ele de raspuns.

    La depasirea limitei pe V3, primesti **429 Too Many Requests** cu headerul `Retry-After` care indica numarul minim de secunde de asteptat inainte de retry:

    ```json
    {
      "status": 429,
      "type": "invalid_request_error",
      "instance": "/api/v3/{vatCode}/...",
      "errors": [
        {
          "code": "rate_limit_exceeded",
          "message": "Rate limit exceeded. Please try again in 10 seconds.",
          "docUrl": "https://api.smartbill.ro/#v3-error-invalid_request_error"
        }
      ]
    }
    ```

    Mesajul de eroare este informativ si poate varia in functie de durata de asteptare. Integrarea trebuie sa se bazeze pe statusul HTTP `429`, pe `code: rate_limit_exceeded` si pe headerul `Retry-After`.

    Daca aplicatia continua sa trimita cereri dupa depasirea limitei, valoarea `Retry-After` poate creste progresiv. In configuratia standard, intervalele de penalizare pot creste pana la cateva minute: `5, 10, 20, 40, 80, 160, 300, 600` secunde. Aceste valori pot fi diferite pentru anumite conturi sau companii. Foloseste intotdeauna valoarea primita in headerul `Retry-After`.

    Raspunsurile API V3 pentru care a fost calculat rate limit-ul includ:

    | Header | Descriere |
    |--------|-----------|
    | `X-RateLimit-Limit` | Limita efectiva pentru fereastra scurta aplicabila cererii curente. Pentru `GET`/`HEAD` este limita de citire; pentru celelalte metode este limita de scriere. |
    | `X-RateLimit-Remaining` | Numarul de cereri ramase in fereastra scurta curenta. |
    | `X-RateLimit-Reset` | Unix timestamp, in secunde, cand se reseteaza fereastra scurta sau intervalul curent de asteptare. |
    | `X-RateLimit-Daily-Limit` | Limita zilnica efectiva. |
    | `X-RateLimit-Daily-Remaining` | Numarul de cereri ramase pana la resetarea limitei zilnice. |
    | `X-RateLimit-Daily-Reset` | Unix timestamp, in secunde, cand se reseteaza limita zilnica. |
    | `Retry-After` | Prezent pe raspunsurile pentru care clientul trebuie sa astepte inainte de retry, de exemplu `429 Too Many Requests` sau `503 Service Unavailable`. Valoarea este in secunde. |

    Daca limita zilnica a fost epuizata, API-ul raspunde tot cu **429 Too Many Requests**. In acest caz, `X-RateLimit-Daily-Remaining` va fi `0`, iar `X-RateLimit-Daily-Reset` indica momentul resetarii limitei zilnice.

    In cazuri rare, API-ul nu poate evalua temporar starea rate limit-ului. In aceasta situatie raspunsul este **503 Service Unavailable**, nu `429`, si include `Retry-After`.

    - Implementeaza retry cu backoff pentru raspunsurile `429 Too Many Requests` si pentru raspunsurile temporare `503 Service Unavailable` care includ `Retry-After`
    - Asteapta cel putin numarul de secunde indicat de `Retry-After` inainte de retry
    - Monitorizeaza `X-RateLimit-Remaining` si `X-RateLimit-Daily-Remaining`; cand valorile se apropie de `0`, redu temporar ritmul cererilor
    - Foloseste paginare si batch processing unde e posibil (ex: nu crea facturi una cate una in bucle rapide)
servers:
- url: https://ws.smartbill.ro/SBORO/api
  description: Productie
security:
- basicAuth: []
x-tagGroups:
- name: Endpoints V1
  tags:
  - Facturi
  - Proforme
  - Incasari
  - Stocuri
  - Email
  - Configurari
- name: Endpoints V3 (Beta)
  tags:
  - NIR-uri (in curand)
  - Produse
  - Clienti
  - Furnizori
  - Gestiuni
tags:
- name: Clienti
  description: |
    Interogare si gestionare clienti.

    > 🔐 **Autentificare**: Bearer token - vezi sectiunea [Autentificare V3](#api-1/description/autentificare-v3).

- name: Furnizori
  description: |
    Interogare si gestionare furnizori.

    > 🔐 **Autentificare**: Bearer token - vezi sectiunea [Autentificare V3](#api-1/description/autentificare-v3).

- name: Gestiuni
  description: |
    Interogare gestiuni si depozite.

    > 🔐 **Autentificare**: Bearer token - vezi sectiunea [Autentificare V3](#api-1/description/autentificare-v3).

- name: Produse
  description: |
    Interogare catalog produse si servicii.

    > 🔐 **Autentificare**: Bearer token - vezi sectiunea [Autentificare V3](#api-1/description/autentificare-v3).

- name: NIR-uri (in curand)
  description: |
    Creare si gestionare Note de Intrare Receptie.

    > 🔐 **Autentificare**: Bearer token - vezi sectiunea [Autentificare V3](#api-1/description/autentificare-v3).

    > 🚧 **In dezvoltare** - Endpoint-urile vor fi adaugate pe masura ce sunt finalizate.

- name: Facturi
  description: |
    Aceasta sectiune acopera ciclul de viata al unei facturi: emitere, stornare, anulare, restaurare si stergere.

    Operatii disponibile:
    - Emitere factura simpla sau pe baza unei proforme
    - Emitere factura ciorna (draft)
    - Emitere factura cu link de plata, in valuta, cu descarcare de gestiune
    - Obtinere PDF factura
    - Verificare status incasare factura
    - Trimitere factura pe email
- name: Proforme
  description: |
    Operatiuni cu proforme/devize - creare, vizualizare PDF, anulare, stergere.

    Similar cu facturile, dar pentru documente de tip proforma.
- name: Incasari
  description: |
    Operatiuni de plata/incasare.

    **Tipuri de plata** - valorile se trimit in campul `type`:
    - Card
    - Card online
    - Chitanta
    - Bon (bon fiscal)
    - Ordin plata
    - CEC
    - Bilet ordin
    - Mandat postal
    - Extras de cont
    - Ramburs
    - Alta incasare

    Litera mare nu conteaza: `Ramburs`, `ramburs` si `RAMBURS` sunt tratate la fel. Spatiile in plus
    invalideaza valoarea - `Ramburs ` sau `Card  online` intorc `404` cu
    `Tipul documentului nu a fost gasit pe server!`.

    Doar `Chitanta` si `Bon` genereaza un document separat. Celelalte tipuri inregistreaza incasarea
    fara sa emita document, iar raspunsul vine fara `number` si `series`.
- name: Configurari
  description: |
    Date de configurare - serii, taxe, informatii despre firma.
- name: Stocuri
  description: |
    Operatiuni de stoc/inventar.
- name: Email
  description: |
    Trimitere documente prin email catre clienti.
paths:
  /invoice/v2:
    post:
      tags:
      - Facturi
      summary: Emitere factura
      operationId: createInvoiceV2
      security:
      - basicAuth: []
      description: |
        Emite o factura noua. Poti emite factura ca ciorna (draft), pe care o finalizezi ulterior din interfata SmartBill.

        **Ai primit o eroare la emiterea facturii?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `companyVatCode`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice emiterii de factura.

        <details>
        <summary><strong>Date document si serii</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Serie inexistenta in cont</td>
              <td><code>Seria nu a fost gasita! Folositi o serie creata in contul de cloud.</code></td>
              <td>Seria trebuie definita in SmartBill Cloud. Trimite in `seriesName` seria facturii, exact cum e configurata in cont.</td>
            </tr>
            <tr>
              <td>Contul a atins numarul maxim de documente permis de pachetul de abonament</td>
              <td><code>Pentru acest pachet s-a emis numarul maxim de documente permis</code></td>
              <td>Limita vine din abonamentul contului SmartBill Cloud, nu din API, deci nu se ridica din integrare. Verifica pachetul in cont.</td>
            </tr>
            <tr>
              <td>Moneda inexistenta sau scrisa gresit</td>
              <td><code>Moneda nu a fost gasita pe server!</code></td>
              <td>Verifica moneda trimisa in `currency`. Valorile acceptate sunt listate in schema campului.</td>
            </tr>
            <tr>
              <td>Data documentului in format gresit</td>
              <td><code>Data documentului trebuie sa fie de forma yyyy-MM-dd.</code></td>
              <td>Trimite `issueDate` in format `yyyy-MM-dd`, de exemplu `2026-06-15`.</td>
            </tr>
            <tr>
              <td><code>sendEmail</code> fara adresa destinatar</td>
              <td><code>Trebuie specificata adresa de email a clientului.</code></td>
              <td>Cand `sendEmail` e `true`, completeaza adresa destinatarului in `email.to` sau in `client.email`.</td>
            </tr>
            <tr>
              <td><code>sendEmail</code> fara server de email</td>
              <td><code>Server-ul de email nu a fost configurat.</code></td>
              <td>Contul nu are un server de email configurat. Intra in SmartBill Cloud si configureaza-ti propriul server de email din <a href="https://cloud.smartbill.ro/core/configurare_mailuri/">Configurare > Email</a>.</td>
            </tr>
          </tbody>
        </table>

        </details>

        <details>
        <summary><strong>Client</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Obiectul <code>client</code> lipseste</td>
              <td><code>tara trebuie specificata</code></td>
              <td>Trimite `client` cu cel putin `name` si `country`.</td>
            </tr>
            <tr>
              <td><code>client.name</code> gol sau <code>null</code></td>
              <td><code>Client invalid!</code></td>
              <td>Trimite un `client.name` valid (nu gol, nu `null`).</td>
            </tr>
            <tr>
              <td><code>client.country</code> lipseste</td>
              <td><code>tara trebuie specificata</code></td>
