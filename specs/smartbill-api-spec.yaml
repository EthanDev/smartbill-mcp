        ## Tipuri de emitere

        <details>
        <summary><strong>1. Emitere proforma simpla</strong></summary>

        Campurile minime obligatorii pentru o proforma valida. Punct de start recomandat pentru integrari noi sau cazuri simple.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": {
            "name": "Client SRL",
            "country": "Romania"
          },
          "products": [{
            "name": "Produs 1",
            "code": "PRD001",
            "quantity": 1,
            "measuringUnitName": "buc",
            "taxPercentage": 21,
            "price": 10
          }]
        }
        ```

        </details>

        <details>
        <summary><strong>2. Emitere proforma completa</strong></summary>

        Un payload complex care combina mai multe optiuni intr-un singur apel - util ca referinta cand integrezi scenarii care depasesc proforma simpla.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "isDraft": false,
          "issueDate": "2026-06-15",
          "dueDate": "2026-07-15",
          "deliveryDate": "2026-06-20",
          "language": "RO",
          "currency": "RON",
          "precision": 2,
          "useIntraCif": false,
          "delegateName": "Ion Popescu",
          "delegateIdentityCard": "AB 123456",
          "delegateAuto": "B-123-ABC",
          "issuerCnp": "1234567890123",
          "issuerName": "Maria Ionescu",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "code": "CLI001",
            "regCom": "J40/1234/2020",
            "isTaxPayer": true,
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania",
            "email": "client@example.com",
            "phone": "0722000000",
            "contact": "Andrei Popa",
            "iban": "RO49AAAA1B31007593840000",
            "bank": "BCR",
            "saveToDb": false
          },
          "products": [
            {
              "name": "Servicii consultanta",
              "code": "SRV001",
              "productDescription": "Servicii de consultanta IT",
              "translatedName": "Consulting services",
              "measuringUnitName": "ora",
              "translatedMeasuringUnit": "hour",
              "quantity": 1,
              "price": 100,
              "taxName": "Normala",
              "taxPercentage": 21,
              "isService": true,
              "saveToDb": false
            },
            {
              "name": "Discount valoric",
              "isDiscount": true,
              "numberOfItems": 1,
              "discountType": 1,
              "discountValue": -10,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            },
            {
              "name": "Produs 1",
              "code": "PRD001",
              "quantity": 2,
              "price": 200,
              "measuringUnitName": "buc",
              "taxName": "Normala",
              "taxPercentage": 21,
              "isService": false,
              "saveToDb": false
            },
            {
              "name": "Discount procentual 10%",
              "isDiscount": true,
              "numberOfItems": 1,
              "discountType": 2,
              "discountPercentage": 10,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            }
          ],
          "paymentUrl": "",
          "sendEmail": false,
          "email": {
            "to": "client@example.com",
            "cc": "",
            "bcc": ""
          },
          "observations": "Marfa se ridica de la sediu in termen de 5 zile lucratoare",
          "mentions": "Plata se face in contul IBAN specificat in contract"
        }
        ```

        </details>

        <details>
        <summary><strong>3. Emitere proforma cu link de plata</strong></summary>

        Emite proforma cu un link de plata asociat butonului 'Plateste cu cardul' de pe document. Necesita un cont Netopia, euPlatesc sau Stripe configurat in <a href="https://cloud.smartbill.ro/core/integrari/">Contul Meu > Integrari</a>. Seteaza `paymentUrl: "Generate URL"` pentru a activa generarea link-ului.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{ "name": "Produs 1", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 21 }],
          "paymentUrl": "Generate URL"
        }
        ```

        </details>

        <details>
        <summary><strong>4. Emitere proforma ciorna (draft)</strong></summary>

        Emite proforma in stare de ciorna, fara numar atribuit. Documentul ramane ca ciorna pana la finalizare manuala din SmartBill Cloud. Seteaza `isDraft: true`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "isDraft": true,
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{ "name": "Produs 1", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 21 }]
        }
        ```

        </details>

        <details>
        <summary><strong>5. Emitere proforma cu discounturi</strong></summary>

        Discounturile se adauga ca linii separate cu `isDiscount: true`. `numberOfItems` stabileste pe cate produse imediat anterioare se aplica discountul. Pentru discount valoric, seteaza `discountType: 1` si foloseste `discountValue`. Pentru discount procentual, seteaza `discountType: 2` si foloseste `discountPercentage`; valoarea procentului trebuie sa fie mai mare decat 0.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [
            {
              "name": "Produs 1",
              "code": "PRD001",
              "quantity": 1,
              "price": 100,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            },
            {
              "name": "Discount valoric",
              "isDiscount": true,
              "numberOfItems": 1,
              "discountType": 1,
              "discountValue": -10,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            },
            {
              "name": "Produs 2",
              "code": "PRD002",
              "quantity": 1,
              "price": 200,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            },
            {
              "name": "Discount procentual 10%",
              "isDiscount": true,
              "numberOfItems": 1,
              "discountType": 2,
              "discountPercentage": 10,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            }
          ]
        }
        ```

        </details>

        <details>
        <summary><strong>6. Emitere proforma cu servicii</strong></summary>

        Marcheaza produsele de tip serviciu cu `isService: true`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{
            "name": "Servicii consultanta",
            "code": "SRV001",
            "quantity": 1,
            "price": 100,
            "measuringUnitName": "ora",
            "taxPercentage": 21,
            "isService": true
          }]
        }
        ```

        </details>

        <details>
        <summary><strong>7. Emitere proforma cu data scadenta</strong></summary>

        Adauga `dueDate` pentru a specifica data scadentei proformei.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "dueDate": "2026-07-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{ "name": "Produs 1", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 21 }]
        }
        ```

        </details>

        <details>
        <summary><strong>8. Emitere proforma cu trimitere pe email</strong></summary>

        Emite proforma si o trimite automat pe email clientului. Seteaza `sendEmail: true` si specifica adresa in `email.to`. Adresa de expeditor si template-ul se configureaza din [Configurare > Email](https://cloud.smartbill.ro/core/configurare_mailuri/).

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "sendEmail": true,
          "email": {
            "to": "client@example.com",
            "cc": "",
            "bcc": ""
          },
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{ "name": "Produs 1", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 21 }]
        }
        ```

        </details>

        <details>
        <summary><strong>9. Emitere proforma in valuta</strong></summary>

        Emite proforma in valuta. Seteaza `currency` si `exchangeRate` la nivel de proforma, si `currency` pe fiecare produs cu aceeasi valuta - cursul apare pe proforma alaturi de echivalentul in RON. `exchangeRate` este optional - daca nu e specificat, se foloseste cursul din [Preferinte personale](https://cloud.smartbill.ro/core/configurare/preferinte-personale/) (sectiunea "Curs valutar preluat de pe Internet": cursul de azi sau de ieri, cu adaos procentual optional).

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "currency": "EUR",
          "exchangeRate": 4.97,
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [
            {
              "name": "Produs 1",
              "code": "PRD001",
              "quantity": 1,
              "price": 100,
              "measuringUnitName": "buc",
              "taxPercentage": 21,
              "currency": "EUR"
            }
          ]
        }
        ```

        </details>

        <details>
        <summary><strong>10. Emitere proforma cu pret referinta in valuta</strong></summary>

        Util cand contractele sunt in valuta dar emiti proforma in RON - de exemplu, un abonament de mentenanta de 100 EUR emis la cursul zilei. Necesita activarea optiunii "Am preturi cu moneda de referinta in valuta" din [Configurare > Generale](https://cloud.smartbill.ro/documente/preferinte-generale/) in SmartBill Cloud. Seteaza `currency` la nivel de produs cu valuta contractului si `currency` la nivel de proforma cu moneda de emitere. `exchangeRate` pe produs este optional - daca nu e specificat, se foloseste cursul din [Preferinte personale](https://cloud.smartbill.ro/core/configurare/preferinte-personale/) (sectiunea "Curs valutar preluat de pe Internet": cursul de azi sau de ieri, cu adaos procentual optional).

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "currency": "RON",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [
            {
              "name": "Produs 1",
              "code": "PRD001",
              "quantity": 1,
              "price": 497,
              "measuringUnitName": "buc",
              "taxPercentage": 21,
              "currency": "EUR",
              "exchangeRate": 4.97
            }
          ]
        }
        ```

        </details>

        <details>
        <summary><strong>11. Emitere proforma cu CIF intracomunitar</strong></summary>

        Daca esti inregistrat in sistemul electronic One Stop Shop, intra in contul SmartBill la [Configurare > Date Firma](https://cloud.smartbill.ro/core/configurare/date-firma/) si completeaza campul `CIF intracomunitar`. Daca ai nevoie de CIF OSS, foloseste optiunea `Genereaza CIF OSS` afisata langa camp. Dupa configurare, seteaza `useIntraCif: true` pentru a emite proforma cu acest CIF.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "useIntraCif": true,
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": {
            "name": "Company GmbH",
            "vatCode": "DE123456789",
            "address": "Musterstrasse 1",
            "city": "Berlin",
            "county": "Berlin",
            "country": "Germania"
          },
          "products": [{ "name": "Servicii consultanta", "code": "SRV001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 0, "taxName": "Taxare inversa", "isService": true }]
        }
        ```

        </details>

        <details>
        <summary><strong>12. Emitere proforma - emitent neplatitor de TVA</strong></summary>

        Daca firma ta nu este platitoare de TVA, nu este necesar sa completezi campurile legate de TVA pe produse.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{ "name": "Produs 1", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc" }]
        }
        ```

        </details>

        <details>
        <summary><strong>13. Emitere proforma cu cote TVA diferite</strong></summary>

        Adauga produse cu cote TVA diferite ca linii separate cu `taxPercentage` corespunzator - SmartBill grupeaza automat pe cote in document. La cota 0%, specifica intotdeauna si un `taxName` existent in cont, de exemplu `Taxare inversa`, `TVA Inclus`, `SDD` sau `SFDD` - fara el, API-ul alege implicit `Taxare inversa`, indiferent de regimul fiscal corect.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [
            { "name": "Produs standard", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 21 },
            { "name": "Aliment", "code": "PRD002", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 11 },
            { "name": "Produs scutit", "code": "PRD003", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 0, "taxName": "SDD" }
          ]
        }
        ```

        </details>

        <details>
        <summary><strong>14. Emitere proforma in limba straina</strong></summary>

        Proforma se emite implicit in limba romana (`RO`). Pentru emiterea intr-o alta limba, seteaza parametrul `language` la nivelul proformei.

        Poti folosi o limba predefinita in SmartBill Cloud sau o limba definita de administrator in cont. Valoarea trimisa in `language` trebuie sa corespunda unei limbi disponibile in cont.

        `language` controleaza limba documentului, dar denumirea produselor si unitatile de masura trebuie traduse explicit pe fiecare produs, prin `translatedName` si `translatedMeasuringUnit`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "language": "EN",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{
            "name": "Produs 1",
            "translatedName": "Product 1",
            "code": "PRD001",
            "quantity": 1,
            "price": 100,
            "measuringUnitName": "buc",
            "translatedMeasuringUnit": "piece",
            "taxPercentage": 21
          }]
        }
        ```

        </details>

        <details>
        <summary><strong>15. Emitere proforma cu observatii si mentiuni</strong></summary>

        Foloseste `observations` si `mentions` pentru textele afisate pe proforma.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_PROFORMEI",
          "issueDate": "2026-06-15",
          "client": { "name": "Client SRL", "vatCode": "RO22222222", "isTaxPayer": true, "address": "Str. Lalelei 1", "city": "Sector 1", "county": "Bucuresti", "country": "Romania", "email": "client@example.com" },
          "products": [{ "name": "Produs 1", "code": "PRD001", "quantity": 1, "price": 100, "measuringUnitName": "buc", "taxPercentage": 21 }],
          "observations": "Marfa se ridica de la sediu in termen de 5 zile lucratoare",
          "mentions": "Plata se face in contul IBAN specificat in contract"
        }
        ```

        </details>

