  /document/send:
    post:
      tags:
      - Email
      summary: Trimitere Document prin Email
      operationId: sendDocumentEmail
      security:
      - basicAuth: []
      description: |
        Trimite o factura sau o proforma catre client, pe email, ca atasament.

        **Cerinte**: trebuie sa ai configurat serverul de email in [SmartBill Cloud > Configurare > Email](https://cloud.smartbill.ro/core/configurare_mailuri/).

        **Variabile pentru textul emailului:**
        Parametrul `bodyText` accepta urmatorii marcatori:
        - `#tip document#` - tipul documentului (factura/proforma)
        - `#serie numar document#` - seria si numarul
        - `#link document#` - link catre document
        - `#data emiterii#` - data emiterii
        - `#data scadentei#` - data scadentei
        - `#total document#` - suma totala, cu moneda
        - `#mentiune#` - mentiunile documentului
        - `#nume client#` - numele clientului
        - `#persoana contact#` - persoana de contact

        **Nota**: atat `subject`, cat si `bodyText` trebuie codificate Base64.

        ## Ce e obligatoriu si ce are fallback

        Obligatorii sunt doar `companyVatCode`, `seriesName`, `number` si `type`. Restul au fallback:

        - `to` omis sau gol - emailul se trimite la adresa clientului de pe document;
        - `subject` sau `bodyText` omise - se foloseste sablonul configurat in contul SmartBill.

        Valoarea din `type` nu e sensibila la litere mari: `factura`, `Factura` si `FACTURA` sunt acceptate la fel. `type` selecteaza si tipul de document cautat - o proforma trimisa cu `type: factura` intoarce `Documentul nu a fost gasit`.

        ## Forma raspunsului

        Endpointul nu raspunde ca restul V1. Raspunsul are un obiect `status`, cu `code` si `message`:

        ```json
        { "status": { "code": 0, "message": "Documentul a fost trimis cu succes." } }
        ```

        `code` este `0` la succes si `1` la eroare. Nu exista camp `errorText` - un client care verifica doar `errorText` nu vede niciodata eroarea. Excepția: erorile de autentificare si de acces la firma vin in forma clasica V1, cu `errorText`, si cu status HTTP `401`.

        **Ai primit o eroare la trimiterea emailului?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `companyVatCode`, drepturi pe firma, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice acestui endpoint. Toate vin cu `status.code: 1`.

        <details>
        <summary><strong>Erori la trimiterea emailului</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Valoare neacceptata in <code>type</code></td>
              <td><code>Valoarea campului 'type' nu este suportata (invoice). Valorile acceptate sunt: factura, proforma.</code></td>
              <td>Trimite `factura` sau `proforma`. Variantele englezesti `invoice` si `estimate` nu sunt acceptate. Litera mare nu conteaza.</td>
            </tr>
            <tr>
              <td><code>type</code> lipsa sau gol</td>
              <td><code>type  trebuie specificat. Valorile acceptate sunt: factura, proforma.</code></td>
              <td>`type` e obligatoriu, spre deosebire de `to`, `subject` si `bodyText`.</td>
            </tr>
            <tr>
              <td>Documentul nu exista, sau <code>type</code> nu corespunde tipului lui</td>
              <td><code>Documentul nu a fost gasit</code></td>
              <td>Verifica `seriesName` si `number`. Apare si cand documentul exista, dar e trimis cu tipul greșit - o proforma cu `type: factura`, de exemplu.</td>
            </tr>
            <tr>
              <td><code>seriesName</code> gol</td>
              <td><code>Seria nu a fost gasita! Folositi o serie creata in contul de cloud.</code></td>
              <td>Trimite o serie existenta in contul SmartBill Cloud.</td>
            </tr>
            <tr>
              <td><code>number</code> gol</td>
              <td><code>Numarul documentului  trebuie specificat</code></td>
              <td>Trimite numarul documentului, ca text.</td>
            </tr>
            <tr>
              <td><code>subject</code> nu e codificat Base64</td>
              <td><code>Subiectul emailului trebuie sa fie codat folosind Base64.</code></td>
              <td>Codifica subiectul in Base64 inainte de trimitere.</td>
            </tr>
            <tr>
              <td><code>bodyText</code> nu e codificat Base64</td>
              <td><code>Continutul emailului trebuie sa fie codat folosind Base64.</code></td>
              <td>Codifica si corpul emailului in Base64.</td>
            </tr>
            <tr>
              <td>Adresa de email invalida, in <code>to</code>, <code>cc</code> sau <code>bcc</code></td>
              <td><code>Invalid Addresses</code>, <code>Missing domain</code>, <code>Missing local name</code>, <code>Domain contains illegal character</code></td>
              <td>Mesajul depinde de felul in care e ruptă adresa. La mai multi destinatari, una singura invalida respinge tot apelul.</td>
            </tr>
            <tr>
              <td>Serverul de email nu e configurat in cont</td>
              <td><code>Server-ul de email nu a fost configurat.</code></td>
              <td>Configureaza serverul de email in [SmartBill Cloud > Configurare > Email](https://cloud.smartbill.ro/core/configurare_mailuri/).</td>
            </tr>
          </tbody>
        </table>

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
            examples:
              invoice:
                summary: Trimitere factura
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_FACTURII
                  number: '0025'
                  type: factura
                  to: client@example.com
                  cc: ''
                  bcc: ''
                  subject: RmFjdHVyYSBGQUMgMDAyNQ==
                  bodyText: QnVuYSB6aXVhLCBBdGFzYXQgdmEgdHJhbnNtaXRlbSBmYWN0dXJhLg==
              proforma:
                summary: Trimitere proforma
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_PROFORMEI
                  number: '0001'
                  type: proforma
                  to: client@example.com
                  subject: UHJvZm9ybWEgUFJPIDAwMDE=
                  bodyText: QnVuYSB6aXVhLCBBdGFzYXQgdmEgdHJhbnNtaXRlbSBwcm9mb3JtYS4=
      responses:
        '200':
          description: Email trimis cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSendResponse'
              example:
                status:
                  code: 0
                  message: Documentul a fost trimis cu succes.
        '400':
          description: Document negasit, parametru invalid sau server de email neconfigurat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSendResponse'
              examples:
                tip_nesuportat:
                  summary: Valoare neacceptata in `type`
                  value:
                    status:
                      code: 1
                      message: 'Valoarea campului ''type'' nu este suportata (invoice). Valorile acceptate sunt: factura, proforma.'
                tip_lipsa:
                  summary: '`type` lipsa sau gol'
                  value:
                    status:
                      code: 1
                      message: 'type  trebuie specificat. Valorile acceptate sunt: factura, proforma.'
                document_negasit:
                  summary: Documentul nu exista in cont
                  value:
                    status:
                      code: 1
                      message: Documentul nu a fost gasit
                serie_lipsa:
                  summary: '`seriesName` gol'
                  value:
                    status:
                      code: 1
                      message: Seria nu a fost gasita! Folositi o serie creata in contul de cloud.
                numar_lipsa:
                  summary: '`number` gol'
                  value:
                    status:
                      code: 1
                      message: Numarul documentului  trebuie specificat
                subiect_necodificat:
                  summary: '`subject` nu e codificat Base64'
                  value:
                    status:
                      code: 1
                      message: Subiectul emailului trebuie sa fie codat folosind Base64.
                corp_necodificat:
                  summary: '`bodyText` nu e codificat Base64'
                  value:
                    status:
                      code: 1
                      message: Continutul emailului trebuie sa fie codat folosind Base64.
                adresa_invalida:
                  summary: Adresa de email invalida
                  value:
                    status:
                      code: 1
                      message: Invalid Addresses
                server_email_neconfigurat:
                  summary: Serverul de email nu e configurat in cont
                  value:
                    status:
                      code: 1
                      message: Server-ul de email nu a fost configurat.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /payment/text:
    get:
      tags:
      - Incasari
      summary: Preluare date bon fiscal
      operationId: getPaymentText
      security:
      - basicAuth: []
      description: |
        Preia continutul unui bon fiscal, codificat Base64, pentru trimitere la imprimanta fiscala.

        Endpoint specific bonurilor fiscale. Parametrul `id` este ID-ul intern al bonului fiscal, returnat la crearea acestuia. Incasarile obisnuite (`Chitanta`, `Card`, `Ordin plata`) nu intorc un astfel de `id`.

        Continutul depinde de casa de marcat setata ca implicita pentru utilizatorul care face apelul - nu de casa pe care s-a emis bonul. Consecinte:

        - acelasi `id` intoarce alt continut daca intre apeluri s-a schimbat casa implicita;
        - doi utilizatori cu case implicite diferite primesc formate diferite pentru acelasi bon;
        - daca pe casa implicita nu e configurata cota de TVA din liniile bonului, apelul intoarce `400`, desi bonul a fost emis cu succes.

        **Ai primit o eroare la preluarea datelor bonului fiscal?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice acestui endpoint.

        <details>
        <summary><strong>Erori la preluarea datelor bonului fiscal</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>id</code> invalid sau inexistent</td>
              <td><code>500</code> cu raspuns HTML</td>
              <td>Verifica faptul ca `id` provine din raspunsul de creare a unui bon fiscal.</td>
            </tr>
            <tr>
              <td>Cota de TVA din liniile bonului nu e configurata pe casa de marcat implicita din momentul apelului</td>
              <td><code>Cota TVA Normala2 (21.00%) nu a fost configurata pentru casa de marcat selectata</code></td>
              <td>Bonul e valid - doar generarea textului pentru casa curenta eșueaza. Configureaza cota pe casa de marcat implicita a utilizatorului care apeleaza, la `Configurari > Case de marcat`.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        schema:
          type: string
        example: CIF_FIRMA
      - name: id
        in: query
        required: true
        description: ID-ul bonului fiscal (returnat la crearea acestuia)
        schema:
          type: integer
        example: 1384
      responses:
        '200':
          description: Continutul bonului fiscal, in `message`, codificat Base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorText:
                    type: string
                  message:
                    type: string
                    description: Continutul bonului fiscal codificat Base64
              example:
                errorText: ''
                message: Qm9uIGZpc2NhbCBjb250ZW50Li4u
        '500':
          description: |
            `id` invalid sau inexistent. Verifica faptul ca `id`-ul provine de la crearea unui bon fiscal.
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payment/chitanta:
    delete:
      tags:
      - Incasari
      summary: Stergere chitanta
      operationId: deleteReceipt
      security:
      - basicAuth: []
      description: |
        Sterge o chitanta. Poate fi stearsa doar ultima chitanta din serie. Parametrii se trimit in URL (query string).

        Pentru incasari care nu sunt chitante (`Card`, `Ordin plata` etc.), foloseste [Stergere incasare](#tag/incasari/DELETE/payment/v2).

        **Ai primit o eroare la stergere?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice stergerii chitantei.

        <details>
        <summary><strong>Erori la stergerea chitantei</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Chitanta nu e ultima din serie</td>
              <td><code>Nu poti sterge documentul cu seria si numarul CH 0003, deoarece nu este ultimul din serie!</code></td>
              <td>Doar ultima chitanta din serie poate fi stearsa.</td>
            </tr>
            <tr>
              <td><code>number</code> lipseste din URL</td>
              <td><code>Numarul chitantei trebuie specificat in url in parametrul 'number'!</code></td>
              <td>Adauga `number` in query string cu numarul chitantei de sters.</td>
            </tr>
            <tr>
              <td><code>seriesname</code> lipseste din URL</td>
              <td><code>Seria chitantei trebuie specificata in url in parametrul 'seriesname'!</code></td>
              <td>Adauga `seriesname` in query string cu seria chitantei.</td>
            </tr>
            <tr>
              <td>Chitanta nu exista</td>
              <td><code>Chitanta nu a fost gasita.</code></td>
              <td>Verifica `seriesname` si `number`.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        schema:
          type: string
        example: CIF_FIRMA
      - name: seriesname
        in: query
        required: true
        description: Seria chitantei
        schema:
          type: string
        example: CHT
      - name: number
        in: query
        required: true
        description: Numarul chitantei
        schema:
          type: string
        example: 0009
      responses:
        '200':
          description: Chitanta stearsa cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                errorText: ''
                message: Chitanta cu seria si numarul CH0006 a fost stearsa cu succes.
                number: ''
                series: ''
                url: ''
        '400':
          description: Parametru lipsa in URL sau document negasit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numar_lipsa:
                  summary: Parametrul number lipsa
                  value:
                    errorText: "Numarul chitantei trebuie specificat in url in parametrul 'number'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                serie_lipsa:
                  summary: Parametrul seriesname lipsa
                  value:
                    errorText: "Seria chitantei trebuie specificata in url in parametrul 'seriesname'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                chitanta_negasita:
                  summary: Chitanta nu exista
                  value:
                    errorText: Chitanta nu a fost gasita.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
        '403':
          description: Chitanta nu e ultima din serie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorText: Nu poti sterge documentul cu seria si numarul CH 0003, deoarece nu este ultimul din serie!
                message: ''
                number: ''
                series: ''
                url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payment/v2:
    delete:
      tags:
      - Incasari
      summary: Stergere incasare
      operationId: deletePaymentV2
      security:
      - basicAuth: []
      description: |
        Sterge o incasare care nu este chitanta (`Card`, `CEC`, `Bilet ordin`, `Ordin plata`, `Mandat postal`, `Alta incasare`). Parametrii se trimit in URL (query string).

        Chitantele si bonurile fiscale nu se sterg de aici. Pentru chitante foloseste [Stergere chitanta](#tag/incasari/DELETE/payment/chitanta).

        Incasarea se identifica in doua moduri (pe langa `cif` si `paymentType`, mereu obligatorii):

        1. **Dupa factura**: `invoiceSeries` + `invoiceNumber`.
        2. **Dupa detaliile incasarii**: `paymentDate` + `paymentValue` + `clientName` + `clientCif`. Toate patru sunt necesare - cu unul singur dintre `clientName` si `clientCif` incasarea nu e gasita.

        Aici `paymentType` este **sensibil la litere mari**, spre deosebire de emiterea incasarii: pentru cec valoarea acceptata la stergere este `CEC`, nu `Cec`.

        `clientCif` trebuie sa fie exact valoarea stocata pe incasare. Daca clientul e platitor de TVA, CIF-ul e stocat cu prefixul `RO`, deci `RO22222222`, nu `22222222`.

        La succes raspunsul este `200` cu `errorText` gol.

        **Ai primit o eroare la stergere?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice stergerii incasarii.

        <details>
        <summary><strong>Erori la stergerea incasarii</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Nicio incasare nu corespunde datelor trimise</td>
              <td><code>Nu au fost gasite incasari conform datelor specificate.</code></td>
              <td>Verifica datele de identificare (factura sau data+valoare+client). Trebuie sa corespunda exact unei incasari existente.</td>
            </tr>
            <tr>
              <td><code>paymentType</code> este Chitanta (tip nepermis aici)</td>
              <td><code>Tipul incasarii (paymentType) poate fi 'Card', 'CEC', 'Bilet ordin', 'Ordin plata', 'Mandat postal', 'Alta incasare'.</code></td>
              <td>Chitantele se sterg prin [Stergere Chitanta](#tag/incasari/DELETE/payment/chitanta), nu prin acest endpoint.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        schema:
          type: string
        example: CIF_FIRMA
      - name: paymentType
        in: query
        required: true
        description: 'Tipul incasarii de sters. Nu poate fi `Chitanta` sau `Bon fiscal`. Trebuie sa fie tipul incasarii existente pe factura: cu alt tip apelul intoarce `Nu au fost gasite incasari conform datelor specificate.`'
        schema:
          type: string
          enum:
          - Card
          - Card online
          - CEC
          - Bilet ordin
          - Ordin plata
          - Mandat postal
          - Extras de cont
          - Ramburs
          - Alta incasare
        example: Ordin plata
      - name: invoiceSeries
        in: query
        required: false
        description: Seria facturii, pentru stergere dupa factura
        schema:
          type: string
      - name: invoiceNumber
        in: query
        required: false
        description: Numarul facturii, pentru stergere dupa factura
        schema:
          type: string
      - name: paymentDate
        in: query
        required: false
        description: Data incasarii, pentru stergere dupa detaliile incasarii
        schema:
          type: string
          format: date
      - name: paymentValue
        in: query
        required: false
        description: Valoarea incasarii, pentru stergere dupa detaliile incasarii
        schema:
          type: number
      - name: clientName
        in: query
        required: false
        description: Numele clientului, pentru stergere dupa detaliile incasarii
        schema:
          type: string
      - name: clientCif
        in: query
        required: false
        description: CIF-ul clientului, pentru stergere dupa detaliile incasarii
        schema:
          type: string
      responses:
        '200':
          description: Incasare stearsa cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                errorText: ''
                message: Incasarea emisa catre clientul Client Match SRL RO22222222 in data de 11/07/2026 cu valoare de 55 de tip Ordin plata a fost stearsa cu succes.
                number: ''
                series: ''
                url: ''
        '400':
          description: Incasare negasita sau tip nepermis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                incasare_negasita:
                  summary: Nicio incasare nu corespunde datelor
                  value:
                    errorText: Nu au fost gasite incasari conform datelor specificate.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                tip_nepermis:
                  summary: paymentType este Chitanta (nepermis aici)
                  value:
                    errorText: Tipul incasarii (paymentType) poate fi 'Card', 'CEC', 'Bilet ordin', 'Ordin plata', 'Mandat postal', 'Alta incasare'.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v3/companies/{cif}/suppliers:
    get:
      tags:
        - Furnizori
      summary: Listare furnizori
      operationId: listSuppliersV3
      security:
        - bearerAuth: []
      description: |
        Returneaza toti furnizorii din nomenclatorul tau SmartBill.

        **Filtrare**

        `name` potriveste oriunde in nume, nu doar la inceput: `?name=eta` gaseste `Furnizor Beta SRL`.

        `vatCode` nu normalizeaza prefixul: un furnizor salvat cu `RO33333333` nu e gasit de `?vatCode=33333333`. Trimite valoarea exact cum e salvata.

