        ## Tipuri de emitere

        <details>
        <summary><strong>1. Emitere factura simpla</strong></summary>

        Campurile minime obligatorii pentru o factura valida. Punct de start recomandat pentru integrari noi sau cazuri simple.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_FACTURII",
          "issueDate": "2026-06-15",
          "client": {
            "name": "Client SRL",
            "country": "Romania"
          },
          "products": [{
            "name": "Produs 1",
            "code": "PRD001",
            "quantity": 1,
            "measuringUnitName": "buc",
            "taxPercentage": 21,
            "price": 10
          }]
        }
        ```

        </details>

        <details>
        <summary><strong>2. Emitere factura completa</strong></summary>

        Un payload complex care combina mai multe optiuni intr-un singur apel - util ca referinta cand integrezi scenarii care depasesc factura simpla.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_FACTURII",
          "isDraft": false,
          "issueDate": "2026-06-15",
          "dueDate": "2026-07-15",
          "deliveryDate": "2026-06-20",
          "paymentDate": "2026-06-15",
          "language": "RO",
          "currency": "RON",
          "precision": 2,
          "useStock": false,
          "useIntraCif": false,
          "usePaymentTax": false,
          "useEstimateDetails": false,
          "delegateName": "Ion Popescu",
          "delegateIdentityCard": "AB 123456",
          "delegateAuto": "B-123-ABC",
          "issuerCnp": "1234567890123",
          "issuerName": "Maria Ionescu",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "code": "CLI001",
            "regCom": "J40/1234/2020",
            "isTaxPayer": true,
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania",
            "email": "client@example.com",
            "phone": "0722000000",
            "contact": "Andrei Popa",
            "iban": "RO49AAAA1B31007593840000",
            "bank": "BCR",
            "saveToDb": false
          },
          "products": [
            {
              "name": "Servicii consultanta",
              "code": "SRV001",
              "productDescription": "Servicii de consultanta IT",
              "translatedName": "Consulting services",
              "measuringUnitName": "ora",
              "translatedMeasuringUnit": "hour",
              "quantity": 1,
              "price": 100,
              "taxName": "Normala",
              "taxPercentage": 21,
              "isService": true,
              "saveToDb": false
            },
            {
              "name": "Discount valoric",
              "isDiscount": true,
              "numberOfItems": 1,
              "discountType": 1,
              "discountValue": -10,
              "measuringUnitName": "buc",
              "taxPercentage": 21
            },
            {
              "name": "Produs 1",
              "code": "PRD001",
              "quantity": 2,
              "price": 200,
              "measuringUnitName": "buc",
              "taxName": "Normala",
              "taxPercentage": 21,
              "isService": false,
              "saveToDb": false
            },
            {
              "name": "Discount procentual 10%",
              "isDiscount": true,
              "numberOfItems": 1,
