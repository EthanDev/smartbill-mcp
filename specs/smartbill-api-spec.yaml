  title: SmartBill API
  version: 1.0.0
  x-last-updated: '2026-08-21'
  contact:
    name: SmartBill API Support
    url: https://api.smartbill.ro
    email: api@smartbill.ro
  description: |-
    ## Introducere

    SmartBill API este un API REST pentru integrarea platformei SmartBill Cloud cu orice sistem extern: magazin online, ERP sau CRM. Endpoint-urile sunt organizate pe resurse (facturi, proforme, etc.), accepta JSON si returneaza coduri HTTP standard.

    ***Ultima actualizare: 17 august 2026***

    **Cu SmartBill API poti:**

    - sa emiti, sa stornezi, sa anulezi si sa stergi documente
    - sa emiti incasari si sa verifici statusul platii
    - sa interoghezi stocurile
    - sa trimiti documente pe email clientilor
    - sa interoghezi configurarile firmei (cote TVA, serii de documente)

    **Versiuni API**

    Alege **V1** pentru facturare si operatiuni curente. Alege **V3** pentru functii noi.

    | API | Scop | Base URL |
    |-----|------|----------|
    | **V1** | Facturare si operatiuni curente | `https://ws.smartbill.ro/SBORO/api` |
    | **V3** | Functii noi | `https://ws.smartbill.ro/SBORO/api/v3` |

    ## Integrare asistata de AI ✨

    Poti da documentatia API direct unui asistent AI - Claude, ChatGPT - si sa iti genereze cod de integrare, sa explice campuri sau sa te ajute cu erorile.

    **Descarca spec-ul OpenAPI**

    Descarca documentatia OpenAPI in format YAML sau JSON si ataseaz-o direct in orice asistent AI.

    **Prompt de context pentru AI**

    Copiaza promptul de mai jos si adauga-l inaintea intrebarii tale, impreuna cu fisierul spec atasat. Asta va ajuta AI-ul cu contextul de care are nevoie.

    ```text
    Ma ajuti sa integrez SmartBill API. Atasez spec-ul OpenAPI complet. Inainte sa-l citesti, iata context critic care nu se vede din schema:

    Alege API-ul corect: foloseste V1 pentru facturare si operatiuni curente. Foloseste V3 pentru functionalitatile noi documentate in spec. V1 foloseste Basic Auth cu email + apiToken. V3 foloseste Bearer token si include CIF-ul companiei in URL.

    Raspuns V1: campul errorText este sursa de adevar pentru cauza erorii - daca e gol apelul a reusit, daca e completat contine mesajul de eroare. Codul HTTP este semnificativ, dar nu acoperitor: citeste intotdeauna errorText, nu doar statusul.

    Erori V3: raspunsurile de eroare folosesc formatul cu errors[], code, message si docUrl. Pentru logica de integrare bazeaza-te pe statusul HTTP si pe code, nu doar pe textul mesajului.

    Typo la numele campului in V1: un camp cu nume necunoscut nu este ignorat. Cererea intoarce HTTP 400 cu un corp JSON de forma {"type": "invalid_request_error", "errors": [{"code": "json_mapping_error", "param": "<camp>"}]}, fara errorText. Citeste errors[].param ca sa afli exact ce camp e gresit. Aceeasi forma apare cand o valoare are alt tip decat cel asteptat si cand JSON-ul e invalid sintactic.

    Stringuri dependente de cont: seriesName, taxName si measuringUnitName trebuie sa coincida exact cu valorile configurate in contul SmartBill Cloud al utilizatorului. Nu inventa aceste valori; cere-le utilizatorului sau citeste-le din endpointurile/configurarile disponibile.

    Pret si TVA: preturile produselor in V1 sunt implicit FARA TVA (isTaxIncluded: false). Seteaza isTaxIncluded: true doar daca pretul include deja TVA.

    Rate limiting V1: 30 apeluri la 10 secunde per token. La depasire, accesul este blocat timp de 10 minute. Urmareste X-RateLimit-Limit, X-RateLimit-Remaining si X-RateLimit-Reset.

    Rate limiting V3: limitele sunt separate pentru citire si scriere si includ limita zilnica. Cererile se cumuleaza pe utilizator + companie, inclusiv cand sunt folosite mai multe token-uri sau aplicatii. La 429 foloseste Retry-After si header-ele X-RateLimit-* / X-RateLimit-Daily-* pentru retry si throttling. Nu face retry imediat.

    ```

    **Cu ce sa incepi**

    - *Genereaza-mi cod Python care emite o factura catre un client persoana juridica*
    - *Ce campuri sunt obligatorii la emiterea unei facturi?*
    - *Cum stornez o factura emisa gresit?*
    - *Ajuta-ma sa inteleg eroarea: Produsul Produs Test nu are codul specificat.*

    ## Quickstart

    Emite prima ta factura in 3 pasi simpli. Ai nevoie de un cont [SmartBill Cloud](https://cloud.smartbill.ro) activ.

    > 💡 SmartBill API are 2 versiuni:
    >
    > - **V1** - facturare, incasari, stocuri, configurari
    > - **V3** - gestiuni, produse, clienti, furnizori, NIR-uri
    >
    > Quickstart-ul foloseste V1. Pentru V3 vezi [Autentificare V3](#api-1/description/autentificare-v3).

    **Pasul 1. Creeaza o serie de facturi**

    Seriile de documente se configureaza din interfata SmartBill. Mergi in pagina [Serii](https://cloud.smartbill.ro/core/configurare/serii/) si creeaza o serie noua de facturi. Noteaza numele seriei - il vei folosi la pasul 3.

    **Pasul 2. Preia tokenul API V1**

    Tokenul API V1 este generat automat la crearea contului SmartBill. Mergi in pagina [Integrari](https://cloud.smartbill.ro/core/integrari/), la sectiunea **API** si copiaza valorile **Email**, **Token** si **CIF**. Le vei folosi la pasul urmator.

    **Pasul 3. Emite factura**

    Inlocuieste `EMAIL`, `TOKEN`, `CIF_FIRMA` (CIF-ul contului tau SmartBill) si seria facturii cu valoarea de la pasul 1:

    ```bash
    curl -X POST https://ws.smartbill.ro/SBORO/api/invoice/v2 \
      -u "EMAIL:TOKEN" \
      -H "Content-Type: application/json" \
      -d '{
        "companyVatCode": "CIF_FIRMA",
        "client": { "name": "Client Test SRL", "country": "Romania" },
        "seriesName": "SERIA_FACTURII",
        "products": [{
          "name": "Produs Test",
          "code": "TEST01",
          "quantity": 1,
          "price": 100,
          "measuringUnitName": "buc",
          "taxName": "Normala",
          "taxPercentage": 21
        }]
      }'
    ```

    Raspuns:

    ```json
    {
      "errorText": "",
      "message": "",
      "number": "3593",
      "series": "SERIA_FACTURII",
      "url": "",
      "documentUrl": "https://cloud.smartbill.ro/documente/editare/factura/20363/",
      "documentId": 20363,
      "documentViewUrl": "https://cloud.smartbill.ro/documente/extern/pf/factura/f6a9a7d3...?srvid=2"
    }
    ```

    Daca `errorText` e gol, factura a fost emisa cu succes. Pentru toate optiunile (facturi din proforma, discount-uri, link de plata, etc.) si detaliile raspunsului, vezi [Facturi](#api-1/tag/facturi).

    ## Autentificare V1

    API-ul V1 foloseste **Basic Authentication** standard HTTP. Trimiti credentialele in headerul `Authorization`, sub forma `email:token` codificate base64.

    Credentialele le gasesti in pagina [Integrari](https://cloud.smartbill.ro/core/integrari/), sectiunea API.

    **Exemplu**

    ```bash
    curl -X POST https://ws.smartbill.ro/SBORO/api/invoice/v2 \
      -u "EMAIL:TOKEN" \
      -H "Content-Type: application/json" \
      -d '{ ... }'
    ```

    ## Autentificare V3

    API-ul V3 foloseste **Bearer tokens**. Trimiti tokenul in headerul `Authorization: Bearer <token>`. Tokenul se genereaza din pagina [Integrari](https://cloud.smartbill.ro/core/integrari/).

    URL-urile V3 includ CIF-ul companiei: `.../v3/companies/{cif}/resursa`. Inlocuieste `{cif}` cu CIF-ul tau la fiecare request.

    Fiecare token apartine unui singur utilizator si unei singure firme.

    **Exemplu**

    ```bash
    curl -H "Authorization: Bearer <token>" \
      https://ws.smartbill.ro/SBORO/api/v3/companies/CIF_FIRMA/clients
    ```

    ## Raspunsuri

    Toate raspunsurile sunt in format **JSON**, dar structura difera intre V1 si V3.

    **V1** - la succes primesti HTTP 200 cu `errorText` gol si campurile documentului emis. Erorile vin cu coduri HTTP specifice (400, 401 etc.) si `errorText` completat.

    ```json
    {
      "errorText": "",
      "message": "",
      "number": "3593",
      "series": "SERIA_FACTURII",
      "url": "",
      "documentUrl": "https://cloud.smartbill.ro/documente/editare/factura/20363/",
      "documentId": 20363,
      "documentViewUrl": "https://cloud.smartbill.ro/documente/extern/pf/factura/f6a9a7d3...?srvid=2"
    }
    ```

    | Camp | Continut |
    |------|----------|
    | `errorText` | Gol la succes. Daca e completat, contine cauza erorii. |
    | `message` | Mesaj auxiliar, de obicei gol. |
    | `number` + `series` | Identificatorul documentului (ex: `fac 3593`). |
    | `url` | Link de plata, populat doar daca ai trimis `paymentUrl: "Generate URL"`. |
    | `documentUrl` | Link de editare in SmartBill Cloud (necesita autentificare). |
    | `documentId` | ID-ul documentului in SmartBill Cloud. Inclus in `documentUrl`. `-1` la eroare. |
    | `documentViewUrl` | Link public catre PDF - il trimiti clientului final fara sa necesite autentificare. |

    **V3** - structura raspunsului depinde de tipul interogarii:

    | Tip interogare | Structura raspuns | Fara rezultate | Exemplu |
    |---|---|---|---|
    | Lista (`/warehouses`) | `items[]` + obiect `pagination` | `items: []`, `pagination.next/previous: null` - nu primesti 404 | `{ "items": [...], "pagination": { "next": "...", "previous": null } }` |
    | Dupa ID (`/warehouses/{id}`) | obiect direct, fara `items` | 404 | `{ "id": "...", "name": "..." }` |

    **Id-urile V3** sunt stabile in timp: le poti salva la tine si le poti folosi oricand ulterior, ca sa ceri inregistrarea prin `GET .../{id}` sau drept cursor `after` / `before` la paginare. Prefixul spune tipul inregistrarii:

    | Prefix | Resursa |
    |---|---|
    | `cus_` | clienti |
    | `sup_` | furnizori |
    | `ware_` | gestiuni |
    | `prod_` | produse si servicii |

    Un id folosit pe alta resursa decat cea a prefixului intoarce `400` cu `malformed_id`.

    ## Reguli generale de format

    - **Codificare**: corpul cererii se trimite in **UTF-8**.
    - **Booleeni**: campurile de tip boolean accepta si `1` / `0`, nu doar `true` / `false`.
    - **Procente**: valorile procentuale se trimit ca numar, fara simbolul `%`. `taxPercentage: 21` merge; `taxPercentage: "21%"` intoarce `400`.
    - **Caractere speciale in JSON**: ghilimelele si backslash-ul din texte trebuie escapate (`\"` si `\\`), altfel corpul cererii nu e JSON valid si primesti `400`.

    ## Paginare

    Paginarea se aplica doar la **API V3**. API V1 nu suporta paginare.

    Endpoint-urile de listare V3 accepta urmatorii query params:

    | Parametru | Tip | Min | Max | Implicit | Descriere |
    |-----------|-----|-----|-----|----------|-----------|
    | `limit` | number | 1 | 100 | 20 | Numar maxim de rezultate |
    | `after` | string | - | - | - | Cursor: id-ul dupa care se continua (exclusiv cu `before`) |
    | `before` | string | - | - | - | Cursor: id-ul inainte de care se continua (exclusiv cu `after`) |

    **Exemplu lista paginata**

    ```bash
    curl -X GET "https://ws.smartbill.ro/SBORO/api/v3/companies/CIF_FIRMA/warehouses?limit=5&after=ware_019f17cddf1272d59f06892d5b760d0b" \
      -H "Authorization: Bearer <token>"
    ```

    **Urmarirea cursorului**

    `pagination.next` si `pagination.previous` sunt URL-uri complete si pastreaza filtrele cererii initiale. Le apelezi ca atare, fara sa readaugi `name`, `code` sau `vatCode`.

    Cand nu mai exista pagina in directia respectiva, campul e `null`. Asta e valabil si cand ultima pagina s-a umplut exact la `limit`, deci `next: null` inseamna sigur ca s-a terminat - nu mai ai de ce sa ceri o pagina in plus ca sa verifici.

    **Erori de paginare**

    | Situatie | `code` | HTTP |
    |----------|--------|------|
    | `limit` in afara intervalului (0 sau 101) | `invalid_field_value` | 400 |
    | `limit` nu e numar | `invalid_field_type` | 400 |
    | `before` si `after` folosite impreuna | `invalid_field_value` | 400 |
    | cursor cu prefix gresit | `malformed_id` | 400 |
    | cursor cu format invalid | `malformed_id` | 400 |

    ## Erori

    SmartBill API foloseste coduri HTTP standard. Formatul corpului de eroare difera intre V1 si V3.

    ### Erori API V1

    Raspunsul de eroare V1 contine mesajul in campul `errorText`.

    | Cod HTTP | Explicatie | Cand apare |
    |----------|------------|------------|
    | 400 | Request invalid | JSON malformat, nume de camp necunoscut, valoare de alt tip sau validare de business picata |
    | 401 | Neautentificat | Credentiale sau token gresit |
    | 403 | Interzis | Token fara permisiuni pe resursa |
    | 404 | Nu exista | Resursa cu ID/CIF/seria specificata nu exista |
    | 405 | Metoda nepermisa | Verbul HTTP nu e acceptat pe endpoint, de exemplu `GET` pe `/invoice/v2`. Raspunsul include headerul `Allow` cu verbele acceptate |
    | 415 | Tip de continut nesuportat | `Content-Type` lipseste sau are alta valoare decat `application/json` |
    | 422 | Date invalide (validare business) | Citeste `errorText` pentru cauza |
    | 429 | Rate limit depasit | Prea multe apeluri. Urmareste header-ele de rate limit |
    | 500 | Eroare server | Reincearca cu backoff |

    **Raspunsurile de eroare vin in doua forme.** Nu toate au `errorText`:

    - **Validare de business** - forma clasica V1, cu `errorText` completat: serie inexistenta, lista
      de produse goala, cota TVA inexistenta, drepturi lipsa. Codurile tipice sunt `400`, `401` si `422`.
    - **Cerere invalida** - cererea e respinsa inainte de logica de facturare si raspunsul **nu are
      `errorText`**. Corpul are alta forma:

    ```json
    {
      "status": 400,
      "type": "invalid_request_error",
      "instance": "/SBORO/api/invoice/v2",
      "errors": [
        {
          "code": "json_mapping_error",
          "message": "Unrecognized property: zzz.",
          "docUrl": "https://api.smartbill.ro/#v3-error-invalid_request_error",
          "param": "zzz"
        }
      ]
    }
    ```

    Valorile lui `code`:

    | `code` | Cand apare | Exemplu de `message` |
    |--------|------------|----------------------|
    | `json_mapping_error` | Nume de camp necunoscut | `Unrecognized property: zzz.` |
    | `json_mapping_error` | Valoare de alt tip decat cel asteptat | `Could not map property: products[0].quantity.` |
    | `json_parse_error` | JSON invalid sintactic | `Error parsing JSON request input.` |
    | `invalid_accept_header` | Header `Accept` pe care endpointul nu il poate servi. Raspunsul e `406` | `The requested resource is not available in the requested format.` |
    | `method_not_allowed` | Verb HTTP nepermis pe endpoint. Raspunsul e `405` si include headerul `Allow` | - |

    Aceeasi forma o au si raspunsurile `405` si `415`. Campul `param` numeste exact campul
    problematic, inclusiv in sub-obiecte si in liste: `estimate.paymentUrl`, `products[0].quantity`.

    In practica: citeste `errorText` daca exista, altfel `errors[].message` si `errors[].param`.

    **`errorText` poate contine HTML.** Erorile de descarcare de gestiune vin cu marcaje in text:

    | Eroare | Ce marcaje contine |
    |--------|--------------------|
    | `Nu ai facut nicio achizitie pentru produsul <nume>.` | `<br/>` inainte de sugestie |
    | `Cantitate stoc insuficienta la ... pentru produsul ...` | `<b>` in jurul documentului, datei si numelui de produs |
    | `Unitatea de masura <um> a produsului <nume> nu are factor de conversie setat.` | un `<div id="moreErrorDetails" style="display:none">` cu cateva paragrafe de text de ajutor |

    Nu afisa `errorText` ca text simplu, dar nu-l randa nici ca HTML fara sa-l cureti. Cel mai simplu
    e sa iei doar prima propozitie, pana la primul `<`: acolo sta cauza, restul e ajutor pentru
    interfata SmartBill Cloud.

    **Format eroare V1**

    ```json
    {
      "errorText": "Seria nu a fost gasita! Folositi o serie creata in contul de cloud.",
      "message": "",
      "number": "",
      "series": "",
      "documentUrl": "",
      "documentId": -1,
      "documentViewUrl": ""
    }
    ```

    > **Atentie:** un camp scris gresit in payload (ex. `nume` in loc de `name`) intoarce **500** cu raspuns HTML, nu JSON. Nu e o eroare de server reala - verifica numele campurilor din schema.

    Erorile de mai jos sunt comune tuturor endpoint-urilor V1 (factura, proforma, bon fiscal etc.) si tin de apelant, nu de tipul documentului.

