  /estimate/pdf:
    get:
      tags:
      - Proforme
      summary: Descarcare proforma PDF
      operationId: getEstimatePdf
      security:
      - basicAuth: []
      description: |
        Descarca proforma in format PDF. Parametrii se trimit in URL (query string).

        Proforma poate fi preluata prin API doar ca fisier PDF. Nu exista endpoint pentru proforma in format JSON sau XML.

        Raspunsul de succes este un fisier binar (`application/octet-stream`), trimis cu `Content-Disposition: attachment`. Numele fisierului incepe cu `factura` chiar si pentru proforme - de exemplu `facturapro0271.pdf`.

        `Content-Type` din raspuns oglindeste header-ul `Accept` trimis in cerere: daca ceri `Accept: application/json`, raspunsul e etichetat `application/json`, desi corpul ramane acelasi PDF. Nu te baza pe `Content-Type` ca sa decizi cum tratezi raspunsul.

        **Nu trimite `Accept: application/pdf`.** Valoarea cea mai naturala e singura care nu merge: raspunsul e `406` cu `{"code": "invalid_accept_header"}`, nu PDF-ul. Merg `application/octet-stream`, `*/*`, `application/json` sau lipsa completa a header-ului `Accept`.

        **Ai primit o eroare la descarcare?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice descarcarii.

        <details>
        <summary><strong>Erori la descarcarea PDF-ului</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>number</code> lipseste din URL</td>
              <td><code>Numarul proformei trebuie specificat in url in parametrul 'number'!</code></td>
              <td>Adauga `number` in query string cu numarul proformei, de exemplu `number=0227`.</td>
            </tr>
            <tr>
              <td><code>seriesname</code> lipseste din URL</td>
              <td><code>Seria proformei trebuie specificata in url in parametrul 'seriesname'!</code></td>
              <td>Adauga `seriesname` in query string cu seria proformei, de exemplu `seriesname=pro`.</td>
            </tr>
            <tr>
              <td>Proforma nu exista</td>
              <td><code>Proforma cu seria si numarul pro99999999 nu a fost gasita!</code></td>
              <td>Verifica `seriesname` si `number`. Combinatia serie plus numar trebuie sa existe in cont.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      - name: seriesname
        in: query
        required: true
        description: Seria proformei
        schema:
          type: string
        example: SERIA_PROFORMEI
      - name: number
        in: query
        required: true
        description: Numarul proformei
        schema:
          type: string
        example: '0227'
      responses:
        '200':
          description: |
            Fisierul PDF al proformei, ca flux binar (`application/octet-stream`). Salveaza-l intr-un fisier `.pdf`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Parametru lipsa in URL sau document negasit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numar_lipsa:
                  summary: Parametrul number lipsa
                  value:
                    errorText: "Numarul proformei trebuie specificat in url in parametrul 'number'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                serie_lipsa:
                  summary: Parametrul seriesname lipsa
                  value:
                    errorText: "Seria proformei trebuie specificata in url in parametrul 'seriesname'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                proforma_negasita:
                  summary: Proforma nu exista
                  value:
                    errorText: Proforma cu seria si numarul pro99999999 nu a fost gasita!
                    message: ''
                    number: ''
                    series: ''
                    url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /estimate/invoices:
    get:
      tags:
      - Proforme
      summary: Verificare facturare proforma
      operationId: getEstimateInvoices
      security:
      - basicAuth: []
      description: |
        Verifica daca o proforma a fost transformata in factura. Parametrii se trimit in URL (query string).

        Raspunsul contine:
        - `areInvoicesCreated` - `true` daca proforma a fost facturata, altfel `false`.
        - `invoices` - lista facturilor generate din proforma (`series`, `number`), prezenta cand `areInvoicesCreated` e `true`.

        **Facturile ciorna apar si ele in lista, cu `number` gol.** O factura salvata in ciorna nu are inca numar, deci intrarea arata ca `{"series": "API", "number": ""}`, iar `areInvoicesCreated` devine `true` chiar daca singura factura generata din proforma e o ciorna. Daca te interesau doar facturile emise, ignora intrarile cu `number` gol.

        **Cum interpretezi raspunsul**

        Verifica mai intai statusul HTTP, apoi `areInvoicesCreated`. Pe acest endpoint, `errorText` poate fi completat si la un raspuns `200`, cand proforma exista dar nu este inca facturata.

        - `200` + `areInvoicesCreated: true` - proforma a fost facturata.
        - `200` + `areInvoicesCreated: false` - proforma exista, dar nu a fost facturata.
        - `400` sau `410` - verifica eroarea returnata.

        **Ai primit o eroare la verificarea facturarii?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice acestui endpoint.

        <details>
        <summary><strong>Erori la verificarea facturarii</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>number</code> lipseste din URL</td>
              <td><code>Numarul proformei trebuie specificat in url in parametrul 'number'!</code></td>
              <td>Adauga `number` in query string cu numarul proformei, de exemplu `number=0226`.</td>
            </tr>
            <tr>
              <td>Proforma nu exista</td>
              <td><code>Proforma cu seria pro si numarul 99999999 nu a fost gasita.</code></td>
              <td>Verifica `seriesname` si `number`. Combinatia serie plus numar trebuie sa existe in cont.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      - name: seriesname
        in: query
        required: true
        description: Seria proformei
        schema:
          type: string
        example: SERIA_PROFORMEI
      - name: number
        in: query
        required: true
        description: Numarul proformei
        schema:
          type: string
        example: '0226'
      responses:
        '200':
          description: |
            Proforma exista. Verifica `areInvoicesCreated` ca sa afli daca a fost facturata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorText:
                    type: string
                  areInvoicesCreated:
                    type: boolean
                    description: true daca proforma a fost transformata in factura
                  invoices:
                    type: array
                    description: Facturile generate din proforma (prezent cand areInvoicesCreated e true)
                    items:
                      type: object
                      properties:
                        series:
                          type: string
                        number:
                          type: string
              examples:
                facturata:
                  summary: Proforma a fost facturata
                  value:
                    errorText: ''
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    areInvoicesCreated: true
                    invoices:
                    - series: SERIA_FACTURII
                      number: '3793'
                nefacturata:
                  summary: Proforma exista dar nu e facturata (errorText doar informativ)
                  value:
                    errorText: Proforma cu seria pro si numarul 0226 nu a fost facturata.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    areInvoicesCreated: false
        '400':
          description: Parametru lipsa in URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorText: "Numarul proformei trebuie specificat in url in parametrul 'number'!"
                message: ''
                number: ''
                series: ''
                url: ''
                areInvoicesCreated: false
        '410':
          description: Proforma nu exista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorText: Proforma cu seria pro si numarul 99999999 nu a fost gasita.
                message: ''
                number: ''
                series: ''
                url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
