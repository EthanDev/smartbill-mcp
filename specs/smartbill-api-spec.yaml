          description: 'Tipul incasarii. Foloseste `Bon` pentru bon fiscal. Litera mare nu conteaza, dar spatiile in plus invalideaza valoarea.'
          x-description-en: 'Payment type. Use `Bon` for a fiscal receipt. Letter case does not matter, but extra spaces invalidate the value.'
          enum:
          - Card
          - Card online
          - Chitanta
          - Bon
          - Ordin plata
          - CEC
          - Bilet ordin
          - Mandat postal
          - Extras de cont
