        isDraft:
          type: boolean
          description: Creeaza chitanta ca ciorna, daca tipul incasarii permite acest lucru.
          default: false
        seriesName:
          type: string
          description: Seria chitantei, obligatorie pentru incasari de tip `Chitanta`.
        number:
          type: string
          description: Numarul bonului fiscal. Daca lipseste, se aloca urmatorul numar disponibil de pe casa de marcat configurata. Se aplica doar incasarilor de tip `Bon`.
        returnFiscalPrinterText:
          type: boolean
          description: |
            Doar pentru `type: Bon`. Controleaza cum ajunge bonul la imprimanta fiscala. `true` returneaza continutul bonului in campul `message` al raspunsului, codificat Base64, pentru tiparire directa pe casa de marcat. `false` nu il returneaza, iar bonul se tipareste din contul SmartBill. Se ia in calcul casa de marcat configurata pentru utilizatorul care face apelul.
          default: false
        observation:
          type: string
          description: Alte observatii in legatura cu incasarea.
        useStock:
          type: boolean
          description: Opereaza stocul pentru produsele de pe bon.
          default: false
        client:
          $ref: '#/components/schemas/Client'
          description: Clientul pentru care se inregistreaza incasarea.
        products:
          type: array
          description: Liniile de produse sau servicii de pe bon. Se trimit la incasari de tip `Bon`.
          items:
            $ref: '#/components/schemas/Product'
