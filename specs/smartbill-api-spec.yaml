  /v3/companies/{cif}/products:
    get:
      tags:
        - Produse
      summary: Listare produse si servicii
      operationId: listProductsV3
      security:
        - bearerAuth: []
      description: |
        Returneaza toate produsele si serviciile din nomenclatorul tau SmartBill. Le distingi dupa `isService`.

        **Filtrare**

        `name` potriveste cuvinte intregi, nu fragmente: `?name=Produs` gaseste `Produs 1`, dar `?name=rodus` nu gaseste nimic.

        Filtrele se combina cu AND: `?name=Produs&code=INEXISTENT` intoarce 0 rezultate. Un filtru trimis gol (`?name=`) e ignorat, deci primesti lista nefiltrata.
      parameters:
        - $ref: '#/components/parameters/CifPath'
        - name: name
          in: query
          schema:
            type: string
          description: Filtreaza dupa nume (potrivire pe cuvant, case-insensitive)
          example: produs
        - name: code
          in: query
          schema:
            type: string
          description: Filtreaza dupa cod intern (potrivire exacta, case-sensitive)
          example: PRD001
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Numar maxim de rezultate returnate (intre 1 si 100)
          example: 2
        - name: after
          in: query
          schema:
            type: string
          description: Cursor pentru pagina urmatoare, id-ul produsului dupa care se continua. Nu se foloseste impreuna cu 'before'.
          example: prod_019f17cde0f37712b5cf1d43c39e0d05
        - name: before
          in: query
          schema:
            type: string
          description: Cursor pentru pagina anterioara, id-ul produsului inainte de care se continua. Nu se foloseste impreuna cu 'after'.
          example: prod_019f17cde0fd7625abd43bf960d10d06
      responses:
        '200':
          description: Lista produse paginata (paginare cursor)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductV3'
                  pagination:
                    type: object
                    properties:
                      next:
                        type: string
                        nullable: true
                        description: URL-ul complet catre pagina urmatoare, sau null daca nu mai exista pagini
                      previous:
                        type: string
                        nullable: true
                        description: URL-ul complet catre pagina anterioara, sau null daca esti pe prima pagina
              example:
                items:
                  - id: prod_019f17cde0f276c9a8de73d769180d04
                    name: Servicii mentenanta
                    description: ""
                    code: ""
                    isService: true
                    price: 25.0
                    measuringUnitName: buc
                    currency: RON
                    vatPercentage: 21.0
                    vatName: Normala
                    isVatIncluded: true
                    cnCode: ""
                    cpvCode: "50700000"
                    countryOfOrigin: ""
                    containerDeposits: []
                  - id: prod_019f17cde0f37712b5cf1d43c39e0d05
                    name: Produs 1
                    description: ""
                    code: ""
                    isService: false
                    price: 32.0
                    measuringUnitName: buc
                    currency: RON
                    vatPercentage: 21.0
                    vatName: Normala
                    isVatIncluded: false
                    cnCode: ""
                    cpvCode: ""
                    countryOfOrigin: ""
                    containerDeposits: []
                pagination:
                  next: https://ws.smartbill.ro/SBORO/api/v3/companies/{cif}/products?limit=2&after=prod_019f17cde0f37712b5cf1d43c39e0d05
                  previous: null
        '400':
          description: Parametri de paginare sau filtrare invalizi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseV3'
              examples:
                limit_in_afara_intervalului:
                  summary: limit in afara intervalului 1-100
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/products
                    errors:
                      - code: invalid_field_value
                        message: The 'limit' field must be between 1 and 100.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: limit
                before_si_after_impreuna:
                  summary: before si after folosite simultan
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/products
                    errors:
                      - code: invalid_field_value
                        message: You can only use 'before' or 'after', not both at the same time.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: before
                cursor_malformat:
                  summary: cursor (before/after) cu prefix gresit
                  value:
                    status: 400
                    type: invalid_request_error
                    instance: /SBORO/api/v3/companies/1234/products
                    errors:
                      - code: malformed_id
                        message: ID must start with prod_
                        docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
        '401':
          $ref: '#/components/responses/UnauthorizedV3'
        '403':
          $ref: '#/components/responses/ForbiddenV3'
        '405':
          $ref: '#/components/responses/MethodNotAllowedV3'
        '406':
          $ref: '#/components/responses/NotAcceptableV3'
  /v3/companies/{cif}/products/{id}:
    get:
      tags:
        - Produse
      summary: Detalii produs
      operationId: getProductV3
      security:
        - bearerAuth: []
      description: Returneaza un singur produs sau serviciu din nomenclator, dupa id.
      parameters:
        - $ref: '#/components/parameters/CifPath'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID-ul produsului
          example: prod_019f17cde0fd7625abd43bf960d10d16
      responses:
        '200':
          description: Detalii produs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductV3'
              example:
                id: "prod_019f17cde0fd7625abd43bf960d10d16"
                name: "Apa sticla 0.5 - AM001"
                description: "Descriere apa sticla 0.5"
                code: ""
                isService: false
                price: 2.0
                measuringUnitName: "sticla"
                currency: "RON"
                vatPercentage: 21.0
                vatName: "Normala"
                isVatIncluded: true
                cnCode: "22011011"
                cpvCode: "15981100"
                countryOfOrigin: ""
                containerDeposits:
                  - type: "Garantie SGR Plastic"
                    quantity: 1
        '400':
          description: ID malformat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseV3'
              examples:
                prefix_gresit:
                  summary: ID cu prefix gresit
                  value:
                    status: 400
                    type: invalid_request_error
                    instance: /SBORO/api/v3/companies/1234/products/cus_019f17cde0fd7625abd43bf960d10d16
                    errors:
                      - code: malformed_id
                        message: ID must start with prod_
                        docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
                format_invalid:
                  summary: ID cu format invalid (caractere non-hex)
                  value:
                    status: 400
                    type: invalid_request_error
                    instance: /SBORO/api/v3/companies/1234/products/prod_zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
                    errors:
                      - code: malformed_id
                        message: Invalid ID format
                        docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
        '401':
          $ref: '#/components/responses/UnauthorizedV3'
        '403':
          $ref: '#/components/responses/ForbiddenV3'
        '404':
          description: Produs negasit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseV3'
              example:
                status: 404
                type: invalid_request_error
                instance: /SBORO/api/v3/companies/1234/products/prod_019f17cde0fd7625abd43bf960d10d16
                errors:
                  - code: product_not_found
                    message: The product with id 'prod_019f17cde0fd7625abd43bf960d10d16' was not found.
                    docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
        '405':
          $ref: '#/components/responses/MethodNotAllowedV3'
        '406':
          $ref: '#/components/responses/NotAcceptableV3'
components:
  parameters:
    CifPath:
      name: cif
      in: path
      required: true
      schema:
        type: string
      description: CIF-ul firmei tale, fara spatii.
      example: CIF_FIRMA
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Email si token API din pagina [Integrari](https://cloud.smartbill.ro/core/integrari/).
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token din pagina [Integrari](https://cloud.smartbill.ro/core/integrari/).
  schemas:
    UnauthorizedResponse:
      type: object
      properties:
        key:
          type: string
          example: "!.oresp@&"
        successfully:
          type: boolean
          example: false
        errorText:
          type: string
          example: Autentificare esuata. Va rugam verificati datele si incercati din nou.
        errorCode:
          type: string
          example: "0"
        message:
          type: string
          example: ''
        operationExecuted:
          type: boolean
          example: false
        cooldown:
          type: integer
          example: 0
        needsConsent:
          type: boolean
          example: false
    InvoiceRequest:
      type: object
      required:
      - companyVatCode
      - seriesName
      - client
      - products
      properties:
        companyVatCode:
          type: string
          description: CIF-ul firmei tale, exact ca in SmartBill Cloud.
          example: CIF_FIRMA
        seriesName:
          type: string
          description: Numele seriei de factura. Seria trebuie sa existe in SmartBill.
          example: SERIA_FACTURII
        issueDate:
          type: string
          format: date
          description: Data facturii, in format `YYYY-MM-DD`. Daca lipseste, se foloseste data curenta.
          example: '2026-06-15'
        dueDate:
          type: string
          format: date
          description: Data scadenta a facturii, in format `YYYY-MM-DD`.
          example: '2026-07-15'
        isDraft:
          type: boolean
          description: Creeaza factura ca ciorna, fara numar alocat pana la finalizarea manuala.
          default: false
        client:
          $ref: '#/components/schemas/Client'
          description: Datele clientului facturat.
        products:
          type: array
          description: Liniile de produse, servicii sau discount de pe factura.
          minItems: 1
          items:
            $ref: '#/components/schemas/Product'
        currency:
          type: string
          description: Codul monedei documentului
          x-description-en: Document currency code
          default: RON
          enum:
          - RON
          - EUR
          - USD
          - GBP
          - CAD
          - AUD
          - CHF
          - TRY
          - CZK
          - DKK
          - HUF
          - MDL
          - SEK
          - NOK
          - JPY
          - EGP
          - PLN
          - RUB
          - AED
          - BRL
          - CNY
          - HRK
          - INR
          - KRW
          - MXN
          - NZD
          - RSD
          - THB
          - UAH
          - XDR
          - ZAR
        exchangeRate:
          type: number
          description: Cursul valutar folosit pentru document. Daca lipseste, SmartBill foloseste cursul disponibil pentru moneda.
        precision:
          type: integer
          description: 'Numarul de zecimale folosit pentru sume. Valorile suportate sunt `2`, `3` si `4`. O valoare mai mare se limiteaza automat la `4`, fara eroare.'
          default: 2
        useStock:
          type: boolean
          description: 'Descarca stocul la emiterea facturii. Liniile de produs trebuie sa includa gestiunea potrivita. Modul de identificare a produsului depinde de setarea `Foloseste cod produs` din cont. Cand e activa, produsul se identifica **doar prin `code`**: unul care exista pe stoc nu e gasit dupa nume, iar apelul intoarce `Produsul ... nu are codul specificat.`. Cand e inactiva, se identifica **prin nume**, fara sensibilitate la litere mari. In ambele cazuri numele din nomenclator se rescrie cu cel trimis, chiar si cand `saveToDb` este `false` - `mere - 76` trimis pentru produsul `Mere - 76` il redenumeste. Unitatea de masura trebuie sa fie exact cea a produsului din nomenclator, iar `buc` si `BUC` sunt tratate diferit.'
          default: false
        payment:
          $ref: '#/components/schemas/InvoicePayment'
          description: Incasarea inregistrata odata cu emiterea facturii. Omite obiectul daca factura ramane neincasata.
        paymentDate:
          type: string
          format: date
          description: Data incasarii, in format `YYYY-MM-DD`.
        paymentUrl:
          type: string
          description: |
            Link de plata. Trimite `Generate URL` pentru generare automata prin procesatorul configurat in SmartBill
            sau trimite un URL propriu, de exemplu un link Stripe.
        sendEmail:
          type: boolean
          description: Trimite factura pe email dupa emitere.
          default: false
        email:
          type: object
          description: Destinatarii emailului, folositi cand `sendEmail` este `true`.
          properties:
            to:
              type: string
              description: Adresa destinatarului. Daca lipseste, se foloseste `client.email`.
            cc:
              type: string
              description: Adrese in copie.
            bcc:
              type: string
              description: Adrese in copie ascunsa.
        language:
          type: string
          description: 'Limba documentului. Valorile valide sunt limbile predefinite in SmartBill Cloud, plus cele definite in cont la `Configurare > Limbi`. O valoare necunoscuta nu e respinsa de server, dar documentul se emite in limba implicita. Pentru numele produsului si unitatea de masura in limba documentului, foloseste `translatedName` si `translatedMeasuringUnit` pe linia de produs.'
          default: RO
          enum:
          - RO
          - EN
          - DE
          - FR
          - IT
          - ES
        observations:
          type: string
          description: Observatii vizibile pe document
        mentions:
          type: string
          description: Mentiuni vizibile pe document
        deliveryDate:
          type: string
          format: date
          description: Data livrarii, in format `YYYY-MM-DD`.
        issuerName:
          type: string
          description: Numele emitentului
        issuerCnp:
          type: string
          description: CNP-ul emitentului (persoana fizica care emite factura)
        delegateName:
          type: string
          description: Numele delegatului
        delegateIdentityCard:
          type: string
          description: Seria si numarul cartii de identitate a delegatului
        delegateAuto:
          type: string
          description: Numarul de inmatriculare al autovehiculului delegatului
        aviz:
          type: string
          description: 'Numarul avizului de insotire a marfii, cand factura se emite pe baza unui aviz. Apare pe factura, in footer, sub forma `Nr aviz: <valoare>`.'
          x-description-en: 'Number of the delivery note, when the invoice is issued based on one. It appears on the invoice, in the footer, as `Nr aviz: <value>`.'
          example: AV-1908
        useIntraCif:
          type: boolean
          description: Foloseste codul TVA intracomunitar pentru client.
          default: false
        usePaymentTax:
          type: boolean
          description: Aplica TVA la incasare pentru factura.
          default: false
        paymentBase:
          type: number
          description: Baza incasata pentru TVA la incasare.
        colectedTax:
          type: number
          description: TVA incasata.
        paymentTotal:
          type: number
          description: Totalul incasat.
        useEstimateDetails:
          type: boolean
          description: Creeaza factura pe baza unei proforme existente.
          default: false
        estimate:
          type: object
          description: Proforma sursa, folosita cand `useEstimateDetails` este `true`.
          properties:
            seriesName:
              type: string
              description: Seria proformei sursa.
            number:
              type: string
              description: Numarul proformei sursa.
            useStock:
              type: boolean
              description: Descarca stocul la emiterea facturii generate din proforma.
    EstimateRequest:
      type: object
      required:
      - companyVatCode
      - seriesName
      - client
      - products
      properties:
        companyVatCode:
          type: string
          description: CIF-ul firmei tale, exact ca in SmartBill Cloud.
        seriesName:
          type: string
          description: Numele seriei de proforma. Seria trebuie sa existe in SmartBill.
        issueDate:
          type: string
          format: date
          description: Data proformei, in format `YYYY-MM-DD`. Daca lipseste, se foloseste data curenta.
        dueDate:
          type: string
          format: date
          description: Data scadenta a proformei, in format `YYYY-MM-DD`.
        isDraft:
          type: boolean
          description: Creeaza proforma ca ciorna, fara numar alocat pana la finalizarea manuala.
          default: false
        client:
          $ref: '#/components/schemas/Client'
          description: Datele clientului pentru care se emite proforma.
        products:
          type: array
          description: Liniile de produse, servicii sau discount de pe proforma.
          minItems: 1
          items:
            $ref: '#/components/schemas/Product'
        currency:
          type: string
          description: Codul monedei documentului
          x-description-en: Document currency code
          default: RON
          enum:
          - RON
          - EUR
          - USD
          - GBP
          - CAD
          - AUD
          - CHF
          - TRY
          - CZK
          - DKK
          - HUF
          - MDL
          - SEK
          - NOK
          - JPY
          - EGP
          - PLN
          - RUB
          - AED
          - BRL
          - CNY
          - HRK
          - INR
          - KRW
          - MXN
          - NZD
          - RSD
          - THB
          - UAH
          - XDR
          - ZAR
        exchangeRate:
          type: number
          description: Cursul valutar folosit pentru document. Daca lipseste, SmartBill foloseste cursul disponibil pentru moneda.
        paymentUrl:
          type: string
          description: Link de plata. Trimite `Generate URL` pentru generare automata prin procesatorul configurat in SmartBill sau trimite un URL propriu.
        sendEmail:
          type: boolean
          description: Trimite proforma pe email dupa emitere.
          default: false
        email:
          type: object
          description: Destinatarii emailului, folositi cand `sendEmail` este `true`.
          properties:
            to:
              type: string
              description: Adresa destinatarului. Daca lipseste, se foloseste `client.email`.
            cc:
              type: string
              description: Adrese in copie.
            bcc:
              type: string
              description: Adrese in copie ascunsa.
        language:
          type: string
          description: 'Limba documentului. Valorile valide sunt limbile predefinite in SmartBill Cloud, plus cele definite in cont la `Configurare > Limbi`. O valoare necunoscuta nu e respinsa de server, dar documentul se emite in limba implicita. Pentru numele produsului si unitatea de masura in limba documentului, foloseste `translatedName` si `translatedMeasuringUnit` pe linia de produs.'
          default: RO
        observations:
          type: string
          description: Observatii afisate pe proforma.
          example: Observatii pentru client
        mentions:
          type: string
          description: Mentiuni afisate pe proforma.
          example: Mentiuni suplimentare
        precision:
          type: integer
          description: 'Numarul de zecimale folosit pentru sume. Valorile suportate sunt `2`, `3` si `4`. O valoare mai mare se limiteaza automat la `4`, fara eroare.'
          x-description-en: 'Number of decimals used for amounts. The supported values are `2`, `3` and `4`. A larger value is automatically capped at `4`, without an error.'
          default: 2
        issuerName:
          type: string
          description: Numele emitentului.
          x-description-en: Issuer name.
        issuerCnp:
          type: string
          description: CNP-ul emitentului, cand pe proforma apare persoana fizica emitenta.
          x-description-en: Personal numeric code of the issuer, when the issuing person is shown on the estimate.
        delegateName:
          type: string
          description: Numele delegatului.
          x-description-en: Delegate name.
        delegateIdentityCard:
          type: string
          description: Seria si numarul cartii de identitate a delegatului.
          x-description-en: Delegate identity-card series and number.
        delegateAuto:
          type: string
          description: Numarul de inmatriculare al autovehiculului delegatului.
          x-description-en: Delegate vehicle registration number.
        useIntraCif:
          type: boolean
          description: Foloseste codul TVA intracomunitar pentru client.
